function Studio({ state, me, now, onSubmit, editing, preset, onCancelEdit }) {
  const round = currentRound(state);
  const phase = phaseOf(round, now);
  const adv = advantageFor(state, me.id, round.number);
  const available = wardrobeFor(state, me.id, round);
  const mine = entriesFor(state, round.id).filter((e) => e.playerId === me.id);
  const max = maxSubmissions(state, me.id, round);

  const source = editing || preset || null;
  const draft = !editing && !preset ? loadDraft(round.id) : null;
  const base = source || draft;
  const [picks, setPicks] = useState(base ? base.items : {});
  const [tints, setTints] = useState(base ? base.colors || {} : {});
  const [look, setLook] = useState(base && base.model ? base.model : (me.model || DEFAULT_MODEL));
  const [name, setName] = useState(base ? base.name || "" : "");
  const [caption, setCaption] = useState(base ? base.caption || "" : "");
  const [draftNote, setDraftNote] = useState(draft ? "Picked up where you left off." : null);
  const [filter, setFilter] = useState("top");
  const [pane, setPane] = useState("wardrobe");
  const [tinting, setTinting] = useState(null);
  const [q, setQ] = useState("");
  const [flash, setFlash] = useState(null);

  const locked = phase === "preview" && adv !== "early_access";
  const closed = phase !== "design" && phase !== "preview";
  const atLimit = !editing && mine.length >= max;

  const shown = useMemo(() => {
    const term = q.trim().toLowerCase();
    return available.filter(
      (i) =>
        (filter === "all" || (filter === "new" ? isNewDrop(i, round) : i.slot === filter)) &&
        (!term || i.name.toLowerCase().includes(term) || (i.note || "").toLowerCase().includes(term))
    );
  }, [available, filter, q, round.number]);

  useEffect(() => {
    if (editing) return;
    const empty = !name && !caption && Object.keys(picks).length === 0;
    if (empty) { clearDraft(round.id); return; }
    saveDraft(round.id, { items: picks, colors: tints, model: look, name: name, caption: caption });
  }, [picks, tints, look, name, caption, editing, round.id]);

  const missing = SLOTS.filter((s) => s.required && !picks[s.id]);
  const canSubmit = missing.length === 0 && name.trim().length > 0 && !closed && !locked && !atLimit;

  function toggle(item) {
    setPicks((p) => {
      const next = Object.assign({}, p);
      if (next[item.slot] === item.id) delete next[item.slot];
      else next[item.slot] = item.id;
      return next;
    });
    setTints((t) => {
      const next = Object.assign({}, t);
      delete next[item.slot];
      return next;
    });
  }

  function tint(slot, color) {
    setTints((t) => {
      const next = Object.assign({}, t);
      if (!color) delete next[slot];
      else next[slot] = color;
      return next;
    });
  }

  function submit() {
    onSubmit({ name: name.trim(), caption: caption.trim(), items: picks, colors: tints, model: look });
    setFlash(editing ? "Look updated." : "Look submitted.");
    if (!editing) { setPicks({}); setTints({}); setName(""); setCaption(""); clearDraft(round.id); setDraftNote(null); }
    setTimeout(() => setFlash(null), 2600);
  }

  if (closed)
    return (
      <div style={{ padding: "60px 0" }}>
        <h2 style={{ fontFamily: DISPLAY, fontSize: 34, lineHeight: 1.1 }}>Entries are closed</h2>
        <p style={{ fontFamily: UI, fontSize: 14, lineHeight: 1.6, color: GRAPHITE, marginTop: 12, maxWidth: "44ch" }}>
          Round {round.number} has moved on to voting. The studio reopens when the next theme drops.
        </p>
      </div>
    );

  if (locked)
    return (
      <div style={{ padding: "60px 0" }}>
        <h2 style={{ fontFamily: DISPLAY, fontSize: 34, lineHeight: 1.1 }}>The wardrobe is not open yet</h2>
        <p style={{ fontFamily: UI, fontSize: 14, lineHeight: 1.6, color: GRAPHITE, marginTop: 12, maxWidth: "44ch" }}>
          Last round's winner has 24 hours alone with it first. Come back when the countdown hits zero.
        </p>
      </div>
    );

  return (
    <div>
      <div style={{ padding: "24px 0 18px" }}>
        <Eyebrow>Designing for {round.theme}</Eyebrow>
        <h2 style={{ fontFamily: DISPLAY, fontSize: "clamp(30px, 8vw, 48px)", lineHeight: 1, marginTop: 10, fontWeight: 500 }}>
          {editing ? "Rework a look" : "Build a look"}
        </h2>
        <p style={{ fontFamily: UI, fontSize: 13, color: GRAPHITE, marginTop: 10 }}>
          One piece per slot. Top, bottom and shoes are required.{" "}
          {editing ? "You are editing " + editing.name + "." : mine.length + " of " + max + " looks used."}
        </p>
        {preset && (
          <p style={{ fontFamily: UI, fontSize: 13, color: SPOT, marginTop: 6 }}>
            Started from another look in the gallery. Change whatever you like, it submits as your own.
          </p>
        )}
        {adv === "rare_unlock" && (
          <p style={{ fontFamily: UI, fontSize: 13, color: SPOT, marginTop: 6 }}>The archive is unlocked for you this round.</p>
        )}
      </div>

      <Rule />

      <div className="flex flex-col lg:flex-row" style={{ gap: 28, paddingTop: 22 }}>
        <div className="order-2" style={{ flex: "0 0 auto", width: "100%", maxWidth: 360 }}>
          <div style={{ marginBottom: 10 }}><Eyebrow>Your look so far</Eyebrow></div>
          <div style={{ border: "1px solid " + HAIR, background: CARD, padding: 10 }}>
            <Model model={look} items={picks} colors={tints} style={{ width: "100%", display: "block", aspectRatio: "4 / 5" }} />
          </div>

          <div style={{ marginTop: 14 }}>
            {SLOTS.map((s) => {
              const item = picks[s.id] ? BY_ID[picks[s.id]] : null;
              const shown = item ? tints[s.id] || item.color : null;
              const open = tinting === s.id;
              return (
                <div key={s.id} style={{ borderBottom: "1px solid " + HAIR }}>
                  <div className="flex items-center justify-between" style={{ padding: "8px 0", gap: 10 }}>
                    <Eyebrow>{s.single}{s.required ? "" : " (optional)"}</Eyebrow>
                    <div className="flex items-center" style={{ gap: 8, minWidth: 0 }}>
                      <div style={{ fontFamily: DISPLAY, fontSize: 14, color: item ? INK : HAIR, textAlign: "right" }}>
                        {item ? item.name : "—"}
                      </div>
                      {item && (
                        <button
                          type="button"
                          onClick={() => setTinting(open ? null : s.id)}
                          title="Change the colour"
                          style={{ width: 22, height: 22, flex: "0 0 auto", borderRadius: "50%", background: shown, border: "1px solid " + (open ? INK : HAIR), cursor: "pointer", padding: 0 }}
                        />
                      )}
                    </div>
                  </div>
                  {open && item && (
                    <div className="flex flex-wrap items-center" style={{ gap: 6, padding: "2px 0 12px" }}>
                      <Chip on={!tints[s.id]} onClick={() => tint(s.id, null)}>As made</Chip>
                      {RECOLOURS.map((c) => (
                        <Swatch key={c} color={c} on={tints[s.id] === c} onClick={() => tint(s.id, c)} />
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <div style={{ marginTop: 20 }}>
            <input
              value={name}
              onChange={(e) => setName(e.target.value.slice(0, 40))}
              placeholder="Name this look"
              style={{ width: "100%", fontFamily: DISPLAY, fontSize: 22, padding: "10px 0", background: "transparent", border: "none", borderBottom: "1px solid " + INK, outline: "none" }}
            />
            <textarea
              value={caption}
              onChange={(e) => setCaption(e.target.value.slice(0, 140))}
              placeholder="Add a caption, one line of styling notes"
              rows={2}
              style={{ width: "100%", fontFamily: UI, fontSize: 13.5, lineHeight: 1.5, padding: "12px 0 8px", background: "transparent", border: "none", borderBottom: "1px solid " + HAIR, outline: "none", resize: "none", marginTop: 6 }}
            />
            <div style={{ marginTop: 6 }}><Eyebrow>{140 - caption.length} characters left</Eyebrow></div>
          </div>

          {atLimit && (
            <p style={{ fontFamily: UI, fontSize: 13, color: SPOT, marginTop: 14 }}>
              You have used all {max} of your looks this round. Delete one from your profile to free a slot.
            </p>
          )}
          {!atLimit && missing.length > 0 && (
            <p style={{ fontFamily: UI, fontSize: 13, color: GRAPHITE, marginTop: 14 }}>
              Still needed: {missing.map((m) => m.single.toLowerCase()).join(", ")}.
            </p>
          )}

          <div style={{ marginTop: 16 }}>
            <Button full onClick={submit} disabled={!canSubmit}>{editing ? "Save changes" : "Submit this look"}</Button>
          </div>
          {editing && (
            <div style={{ marginTop: 8 }}><Button full kind="quiet" onClick={onCancelEdit}>Cancel</Button></div>
          )}
          {!editing && (Object.keys(picks).length > 0 || name) && (
            <div className="flex items-center justify-between" style={{ gap: 10, marginTop: 10 }}>
              <Eyebrow>{draftNote || "Saved as a draft"}</Eyebrow>
              <Button small kind="quiet" onClick={() => {
                clearDraft(round.id); setPicks({}); setTints({}); setName(""); setCaption(""); setDraftNote(null);
              }}>Start over</Button>
            </div>
          )}
          {flash && (
            <div style={{ marginTop: 12, fontFamily: UI, fontSize: 13, color: SPOT, border: "1px solid " + SPOT, padding: "10px 12px" }}>{flash}</div>
          )}
        </div>

        <div className="order-1" style={{ flex: "1 1 auto", minWidth: 0 }}>
          <div className="flex" style={{ gap: 8, marginBottom: 16 }}>
            <Chip on={pane === "wardrobe"} onClick={() => setPane("wardrobe")}>Wardrobe</Chip>
            <Chip on={pane === "model"} onClick={() => setPane("model")}>Your model</Chip>
          </div>

          {pane === "model" ? (
            <div>
              <p style={{ fontFamily: UI, fontSize: 13, color: GRAPHITE, lineHeight: 1.6, marginBottom: 6, maxWidth: "46ch" }}>
                Your model is saved for next time, and each look remembers the model you sent down the runway in it.
              </p>
              <ModelEditor model={look} onChange={setLook} />
            </div>
          ) : (
          <div>
          <input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            placeholder="Search the wardrobe"
            style={{ width: "100%", fontFamily: UI, fontSize: 14, padding: "10px 0", background: "transparent", border: "none", borderBottom: "1px solid " + INK, outline: "none" }}
          />
          <div className="flex flex-wrap" style={{ gap: 6, margin: "14px 0 18px" }}>
            {[{ id: "all", label: "Everything" }, { id: "new", label: "New this round" }].concat(SLOTS).map((s) => {
              const on = filter === s.id;
              return (
                <button
                  key={s.id}
                  type="button"
                  onClick={() => setFilter(s.id)}
                  style={{ fontFamily: UI, fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", padding: "7px 11px", border: "1px solid " + (on ? INK : HAIR), background: on ? INK : "transparent", color: on ? PAPER : GRAPHITE, cursor: "pointer" }}
                >
                  {s.label}{picks[s.id] ? " ✓" : ""}
                </button>
              );
            })}
          </div>

          {shown.length === 0 ? (
            <p style={{ fontFamily: UI, fontSize: 14, color: GRAPHITE, padding: "30px 0" }}>
              Nothing matches that search. Try a fabric, a colour, or clear the field.
            </p>
          ) : (
            <div className="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4" style={{ gap: 10 }}>
              {shown.map((item) => (
                <ItemTile key={item.id} item={item} fresh={isNewDrop(item, round)} selected={picks[item.slot] === item.id} onClick={() => toggle(item)} />
              ))}
            </div>
          )}
          </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Gallery({ state, me, now, onVote, onReact, onRestyle, isHost, onRemove }) {
  const round = currentRound(state);
  const phase = phaseOf(round, now);
  const [sort, setSort] = useState("new");
  const [showing, setShowing] = useState(false);
  const canVote = phase === "voting";
  const weight = advantageFor(state, me.id, round.number) === "double_vote" ? 2 : 1;
  const anon = phase !== "results" && !isHost;
  const left = votesLeft(state, me.id, round.id, "main");
  const sealed = (phase === "design" || phase === "preview") && !isHost;

  const list = useMemo(() => {
    const e = entriesFor(state, round.id).map((entry) => ({ entry, votes: tallyFor(state, entry.id) }));
    if (sort === "top") e.sort((a, b) => b.votes - a.votes || a.entry.createdAt - b.entry.createdAt);
    else e.sort((a, b) => b.entry.createdAt - a.entry.createdAt);
    return e;
  }, [state, round.id, sort]);

  const mineList = list.filter((x) => x.entry.playerId === me.id);

  const myVotes = new Set(
    liveVotes(state)
      .filter((v) => v.playerId === me.id && v.roundId === round.id && (v.category || "main") === "main")
      .map((v) => v.entryId)
  );

  return (
    <div>
      <div style={{ padding: "24px 0 18px" }}>
        <Eyebrow>Round {String(round.number).padStart(2, "0")} gallery</Eyebrow>
        <h2 style={{ fontFamily: DISPLAY, fontSize: "clamp(30px, 8vw, 48px)", lineHeight: 1, marginTop: 10, fontWeight: 500 }}>{round.theme}</h2>
        <p style={{ fontFamily: UI, fontSize: 13.5, color: GRAPHITE, marginTop: 10, maxWidth: "48ch", lineHeight: 1.6 }}>
          {canVote
            ? "You have three votes for best look, and one vote for each of the four side awards. Not your own looks, and names stay hidden until results."
            : sealed
            ? "Design in private all week. Everything unseals when entries close and voting opens."
            : "Voting has finished for this round."}
        </p>
        {canVote && (
          <div className="flex flex-wrap" style={{ gap: 8, marginTop: 12 }}>
            {AWARDS.map((a) => {
              const n = votesLeft(state, me.id, round.id, a.id);
              return (
                <div key={a.id} style={{ border: "1px solid " + (n ? HAIR : "transparent"), background: n ? "transparent" : CARD, padding: "6px 10px" }}>
                  <Eyebrow color={n ? GRAPHITE : HAIR}>{a.short} {n}/{a.votes}</Eyebrow>
                </div>
              );
            })}
          </div>
        )}
        {canVote && weight > 1 && (
          <p style={{ fontFamily: UI, fontSize: 13, color: SPOT, marginTop: 6 }}>Your votes count double this round.</p>
        )}
      </div>

      <Rule />

      {sealed && (
        <div style={{ padding: "34px 0" }}>
          <div style={{ border: "1px solid " + INK, padding: 22, textAlign: "center" }}>
            <div style={{ fontFamily: DISPLAY, fontSize: 48, lineHeight: 1 }}>{list.length}</div>
            <div style={{ marginTop: 8 }}>
              <Eyebrow>{list.length === 1 ? "look entered so far" : "looks entered so far"}</Eyebrow>
            </div>
            <p style={{ fontFamily: DISPLAY, fontStyle: "italic", fontSize: 19, lineHeight: 1.5, marginTop: 18, maxWidth: "28ch", marginLeft: "auto", marginRight: "auto" }}>
              Everything stays sealed until entries close on {whenLabel(round.closesAt)}. Nobody sees anybody else's look before then.
            </p>
          </div>

          {mineList.length > 0 && (
            <div style={{ marginTop: 34 }}>
              <Eyebrow>Your looks in this round</Eyebrow>
              <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3" style={{ gap: 18, marginTop: 14 }}>
                {mineList.map(({ entry }) => (
                  <EntryCard key={entry.id} entry={entry} votes={0} showVotes={false}>
                    <div className="flex flex-wrap" style={{ gap: 6 }}>
                      <ShareLook entry={entry} round={round} designer={entry.playerName} />
                    </div>
                  </EntryCard>
                ))}
              </div>
            </div>
          )}
        </div>
      )}

      {!sealed && list.length > 0 && (
        <div style={{ padding: "18px 0 4px" }}>
          <Button full kind="solid" onClick={() => setShowing(true)}>
            Watch the runway — all {list.length} looks
          </Button>
        </div>
      )}

      {showing && (
        <RunwayShow
          looks={list}
          me={me}
          state={state}
          round={round}
          anon={anon}
          canVote={canVote}
          votedIds={myVotes}
          onVote={onVote}
          onReact={onReact}
          onClose={() => setShowing(false)}
        />
      )}

      <div className="flex items-center" style={{ gap: 8, padding: "14px 0 20px", display: sealed ? "none" : undefined }}>
        <Eyebrow>Sort</Eyebrow>
        {[["new", "Newest"], ["top", "Most voted"]].map(([k, label]) => (
          <button
            key={k}
            type="button"
            onClick={() => setSort(k)}
            style={{ fontFamily: UI, fontSize: 11, letterSpacing: "0.12em", textTransform: "uppercase", padding: "6px 10px", border: "1px solid " + (sort === k ? INK : HAIR), background: sort === k ? INK : "transparent", color: sort === k ? PAPER : GRAPHITE, cursor: "pointer" }}
          >
            {label}
          </button>
        ))}
      </div>

      {sealed ? null : list.length === 0 ? (
        <div style={{ padding: "50px 0" }}>
          <p style={{ fontFamily: DISPLAY, fontSize: 24, lineHeight: 1.3 }}>No looks yet. Be the first on the board.</p>
        </div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3" style={{ gap: 18 }}>
          {list.map(({ entry, votes }) => {
            const own = entry.playerId === me.id;
            const voted = myVotes.has(entry.id);
            return (
              <EntryCard key={entry.id} entry={entry} votes={votes} showVotes={canVote || isHost} anonymous={anon && !own}>
                {own ? (
                  <Eyebrow>Your look</Eyebrow>
                ) : canVote ? (
                  <div>
                    <Button
                      full small
                      kind={voted ? "solid" : "ghost"}
                      disabled={!voted && left === 0}
                      onClick={() => onVote(entry.id, "main")}
                    >
                      {voted ? "Voted, tap to undo" : left === 0 ? "No votes left" : "Vote for best look"}
                    </Button>
                    <AwardVotes state={state} entry={entry} me={me} round={round} onVote={onVote} />
                  </div>
                ) : (
                  <Eyebrow color={HAIR}>Voting opens when entries close</Eyebrow>
                )}

                <div style={{ marginTop: 12 }}>
                  <ReactionRow state={state} entryId={entry.id} me={me} onReact={onReact} small />
                </div>

                <div className="flex flex-wrap" style={{ gap: 6, marginTop: 10 }}>
                  <ShareLook entry={entry} round={round} designer={anon && !own ? "Runway" : entry.playerName} />
                  {isHost && <Button small kind="quiet" onClick={() => onRemove(entry.id)}>Remove</Button>}
                </div>
              </EntryCard>
            );
          })}
        </div>
      )}
    </div>
  );
}

function AdvantagePicker({ onPick, heading }) {
  const [choice, setChoice] = useState(null);
  const [theme, setTheme] = useState("");
  return (
    <div style={{ border: "1px solid " + SPOT, padding: 18, marginTop: 22 }}>
      <Eyebrow color={SPOT}>{heading}</Eyebrow>
      <div style={{ marginTop: 14 }}>
        {Object.keys(ADVANTAGES).map((key) => (
          <button
            key={key}
            type="button"
            onClick={() => setChoice(key)}
            style={{ display: "block", width: "100%", textAlign: "left", padding: "12px 14px", marginBottom: 8, border: "1px solid " + (choice === key ? SPOT : HAIR), background: choice === key ? "#fff" : "transparent", cursor: "pointer" }}
          >
            <div style={{ fontFamily: DISPLAY, fontSize: 19 }}>{ADVANTAGES[key].name}</div>
            <div style={{ fontFamily: UI, fontSize: 13, color: GRAPHITE, marginTop: 3, lineHeight: 1.5 }}>{ADVANTAGES[key].blurb}</div>
          </button>
        ))}
      </div>
      {choice === "theme_control" && (
        <input
          value={theme}
          onChange={(e) => setTheme(e.target.value.slice(0, 44))}
          placeholder="Next round's theme"
          style={{ width: "100%", fontFamily: DISPLAY, fontSize: 20, padding: "10px 0", background: "transparent", border: "none", borderBottom: "1px solid " + INK, outline: "none", marginBottom: 14 }}
        />
      )}
      <Button full kind="spot" disabled={!choice || (choice === "theme_control" && !theme.trim())} onClick={() => onPick(choice, theme.trim())}>
        Claim advantage
      </Button>
    </div>
  );
}


function SeasonTable({ state, me }) {
  const season = state.season || { number: 1, target: SEASON_TARGET };
  const table = standings(state, season.number);
  const done = state.rounds.filter((r) => (r.seasonNumber || 1) === season.number && r.winnerEntryId).length;
  const top = table.length ? Math.max(1, table[0].points) : 1;
  const hall = (state.halloffame || []).slice().sort((a, b) => b.season - a.season);

  return (
    <div style={{ marginTop: 44 }}>
      <div className="flex items-baseline justify-between" style={{ gap: 12 }}>
        <Eyebrow>Season {season.number} standings</Eyebrow>
        <Eyebrow>{done} of {season.target} rounds</Eyebrow>
      </div>

      <div style={{ height: 3, background: HAIR, marginTop: 10 }}>
        <div style={{ height: 3, background: INK, width: Math.min(100, (done / season.target) * 100) + "%" }} />
      </div>

      {season.championId && (
        <div style={{ border: "1px solid " + INK, background: CARD, padding: 16, marginTop: 16 }}>
          <Eyebrow>Champion of season {season.number}</Eyebrow>
          <div style={{ fontFamily: DISPLAY, fontSize: 30, marginTop: 6 }}>{season.championName}</div>
        </div>
      )}

      {table.length === 0 ? (
        <p style={{ fontFamily: UI, fontSize: 13.5, color: GRAPHITE, marginTop: 14 }}>
          Points appear once the first round is scored.
        </p>
      ) : (
        <div style={{ marginTop: 14 }}>
          {table.map((p, i) => {
            const isMe = p.playerId === me.id;
            return (
              <div key={p.playerId} style={{ padding: "11px 0", borderBottom: "1px solid " + HAIR }}>
                <div className="flex items-center" style={{ gap: 12 }}>
                  <div style={{ width: 24, fontFamily: DISPLAY, fontSize: 16, color: i === 0 ? INK : GRAPHITE, fontVariantNumeric: "tabular-nums" }}>{i + 1}</div>
                  <div style={{ flex: "1 1 auto", minWidth: 0 }}>
                    <div style={{ fontFamily: DISPLAY, fontSize: 17, lineHeight: 1.2 }}>
                      {p.name}{isMe ? " (you)" : ""}
                    </div>
                    <div style={{ marginTop: 2 }}>
                      <Eyebrow>{p.wins} {p.wins === 1 ? "win" : "wins"}, {p.awards} awards, {p.looks} looks</Eyebrow>
                    </div>
                    <div style={{ height: 3, background: i === 0 ? SPOT : HAIR, width: (p.points / top) * 100 + "%", marginTop: 7, minWidth: 2 }} />
                  </div>
                  <div style={{ fontFamily: DISPLAY, fontSize: 20, fontVariantNumeric: "tabular-nums", color: i === 0 ? SPOT : INK }}>{p.points}</div>
                </div>
              </div>
            );
          })}
          <p style={{ fontFamily: UI, fontSize: 12, color: GRAPHITE, marginTop: 10, lineHeight: 1.6 }}>
            Ten points for winning a round, six for second, four for third, one for entering, two for every side award.
          </p>
        </div>
      )}

      {hall.length > 0 && (
        <div style={{ marginTop: 32 }}>
          <Eyebrow>Hall of fame</Eyebrow>
          <div style={{ marginTop: 10 }}>
            {hall.map((h) => (
              <div key={h.id} className="flex items-baseline justify-between" style={{ padding: "10px 0", borderBottom: "1px solid " + HAIR, gap: 12 }}>
                <div style={{ fontFamily: DISPLAY, fontSize: 18 }}>
                  <span style={{ color: GRAPHITE, fontSize: 14 }}>Season {h.season}&nbsp;&nbsp;</span>
                  {h.championName}
                </div>
                <Eyebrow>{h.points} pts</Eyebrow>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function Results({ state, me, now, onClaim, isHost, onRestyle }) {
  const finished = state.rounds.filter((r) => phaseOf(r, now) === "results").sort((a, b) => b.number - a.number);
  const [openId, setOpenId] = useState(null);

  if (!finished.length)
    return (
      <div style={{ padding: "60px 0" }}>
        <h2 style={{ fontFamily: DISPLAY, fontSize: 34, lineHeight: 1.1 }}>No results yet</h2>
        <p style={{ fontFamily: UI, fontSize: 14, lineHeight: 1.6, color: GRAPHITE, marginTop: 12, maxWidth: "44ch" }}>
          The round is still running. Rankings appear here the moment voting closes.
        </p>
      </div>
    );

  const latest = finished[0];
  const ranked = rankEntries(state, latest.id);
  const live = currentRound(state);
  const livePhase = phaseOf(live, now);
  const canRestyle = live.id !== latest.id && (livePhase === "design" || livePhase === "preview");
  const winner = ranked[0];
  const iWon = winner && winner.entry.playerId === me.id;
  const topVotes = winner ? Math.max(1, winner.votes) : 1;

  return (
    <div>
      <div style={{ padding: "24px 0 18px" }}>
        <Eyebrow>Round {String(latest.number).padStart(2, "0")} final</Eyebrow>
        <h2 style={{ fontFamily: DISPLAY, fontSize: "clamp(30px, 8vw, 48px)", lineHeight: 1, marginTop: 10, fontWeight: 500 }}>{latest.theme}</h2>
      </div>

      {winner && (
        <div style={{ border: "1px solid " + INK, background: CARD }}>
          <div style={{ padding: "14px 16px", borderBottom: "1px solid " + INK }}><Eyebrow color={INK}>Winning look</Eyebrow></div>
          <LookCard entry={winner.entry} />
          <div style={{ padding: 18, borderTop: "1px solid " + HAIR }}>
            <div style={{ fontFamily: DISPLAY, fontSize: 30, lineHeight: 1.05 }}>{winner.entry.name}</div>
            <div style={{ marginTop: 8 }}><Eyebrow>{winner.entry.playerName}, {winner.votes} votes</Eyebrow></div>
            {winner.entry.caption && (
              <p style={{ fontFamily: DISPLAY, fontStyle: "italic", fontSize: 17, lineHeight: 1.5, marginTop: 12 }}>{winner.entry.caption}</p>
            )}
            <div className="flex flex-wrap" style={{ gap: 6, marginTop: 14 }}>
              <ShareLook entry={winner.entry} round={latest} designer={winner.entry.playerName} />
              {canRestyle && (
                <Button small kind="quiet" onClick={() => onRestyle(winner.entry)}>Restyle this</Button>
              )}
            </div>
          </div>
        </div>
      )}

      {latest.advantage ? (
        <div style={{ border: "1px solid " + HAIR, padding: 16, marginTop: 18 }}>
          <Eyebrow>Advantage claimed</Eyebrow>
          <div style={{ fontFamily: DISPLAY, fontSize: 22, marginTop: 8 }}>
            {ADVANTAGES[latest.advantage.type].name}
            {latest.advantage.payload ? ': "' + latest.advantage.payload + '"' : ""}
          </div>
          <p style={{ fontFamily: UI, fontSize: 13.5, color: GRAPHITE, marginTop: 6, lineHeight: 1.55 }}>{ADVANTAGES[latest.advantage.type].blurb}</p>
        </div>
      ) : iWon ? (
        <AdvantagePicker heading="You won. Choose your advantage" onPick={(t, p) => onClaim(latest.id, t, p, winner.entry.playerId)} />
      ) : isHost ? (
        <AdvantagePicker
          heading={"Choose on behalf of " + (winner ? winner.entry.playerName : "the winner")}
          onPick={(t, p) => onClaim(latest.id, t, p, winner.entry.playerId)}
        />
      ) : (
        <div style={{ border: "1px dashed " + HAIR, padding: 16, marginTop: 18 }}>
          <Eyebrow>Advantage pending</Eyebrow>
          <p style={{ fontFamily: UI, fontSize: 13.5, color: GRAPHITE, marginTop: 6 }}>
            {winner ? winner.entry.playerName : "The winner"} has not picked yet.
          </p>
        </div>
      )}

      {awardWinners(state, latest.id).length > 0 && (
        <div style={{ marginTop: 30 }}>
          <Eyebrow>Side awards</Eyebrow>
          <div className="grid grid-cols-1 sm:grid-cols-2" style={{ gap: 12, marginTop: 12 }}>
            {awardWinners(state, latest.id).map((w) => (
              <div key={w.award.id} className="flex items-center" style={{ gap: 12, border: "1px solid " + HAIR, padding: 10 }}>
                <div style={{ width: 54, flex: "0 0 auto", border: "1px solid " + HAIR }}>
                  <LookCard entry={w.entry} compact />
                </div>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontFamily: DISPLAY, fontSize: 17, lineHeight: 1.15 }}>{w.award.name}</div>
                  <div style={{ marginTop: 3 }}><Eyebrow>{w.entry.playerName}, {w.votes} votes</Eyebrow></div>
                  <div style={{ fontFamily: DISPLAY, fontStyle: "italic", fontSize: 14, color: GRAPHITE, marginTop: 3 }}>
                    {w.entry.name}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div style={{ marginTop: 34 }}>
        <Eyebrow>Full ranking</Eyebrow>
        <div style={{ marginTop: 12 }}>
          {ranked.map((r, i) => (
            <div key={r.entry.id} style={{ padding: "12px 0", borderBottom: "1px solid " + HAIR }}>
              <div className="flex items-center" style={{ gap: 12 }}>
                <div style={{ fontFamily: DISPLAY, fontSize: 17, width: 26, color: i === 0 ? INK : GRAPHITE, fontVariantNumeric: "tabular-nums" }}>{i + 1}</div>
                <div style={{ width: 46, flex: "0 0 auto", border: "1px solid " + HAIR }}><LookCard entry={r.entry} compact /></div>
                <div style={{ flex: "1 1 auto", minWidth: 0 }}>
                  <div style={{ fontFamily: DISPLAY, fontSize: 16, lineHeight: 1.2 }}>{r.entry.name}</div>
                  <div style={{ marginTop: 2 }}><Eyebrow>{r.entry.playerName}</Eyebrow></div>
                  <div style={{ height: 3, background: i === 0 ? SPOT : HAIR, width: (r.votes / topVotes) * 100 + "%", marginTop: 7, minWidth: 2 }} />
                </div>
                <div style={{ fontFamily: DISPLAY, fontSize: 18, fontVariantNumeric: "tabular-nums", color: i === 0 ? SPOT : INK }}>{r.votes}</div>
              </div>
              {canRestyle && (
                <div style={{ marginTop: 8, paddingLeft: 38 }}>
                  <Button small kind="quiet" onClick={() => onRestyle(r.entry)}>Restyle this</Button>
                </div>
              )}
            </div>
          ))}
        </div>
      </div>

      <SeasonTable state={state} me={me} />

      {finished.length > 1 && (
        <div style={{ marginTop: 40 }}>
          <Eyebrow>Archive</Eyebrow>
          <div style={{ marginTop: 12 }}>
            {finished.slice(1).map((r) => {
              const rk = rankEntries(state, r.id);
              const w = rk[0];
              const open = openId === r.id;
              return (
                <div key={r.id} style={{ borderTop: "1px solid " + HAIR }}>
                  <button
                    type="button"
                    onClick={() => setOpenId(open ? null : r.id)}
                    style={{ width: "100%", textAlign: "left", padding: "16px 0", background: "transparent", border: "none", cursor: "pointer" }}
                  >
                    <div className="flex items-baseline justify-between" style={{ gap: 12 }}>
                      <div style={{ fontFamily: DISPLAY, fontSize: 22 }}>
                        <span style={{ color: GRAPHITE, fontSize: 15 }}>{String(r.number).padStart(2, "0")}&nbsp;&nbsp;</span>
                        {r.theme}
                      </div>
                      <div style={{ fontFamily: UI, fontSize: 18, color: GRAPHITE }}>{open ? "–" : "+"}</div>
                    </div>
                    {w && <div style={{ marginTop: 6 }}><Eyebrow>Won by {w.entry.playerName} with "{w.entry.name}"</Eyebrow></div>}
                  </button>
                  {open && (
                    <div className="grid grid-cols-2 sm:grid-cols-3" style={{ gap: 12, paddingBottom: 20 }}>
                      {rk.map((x, i) => (
                        <div key={x.entry.id} style={{ border: "1px solid " + HAIR }}>
                          <LookCard entry={x.entry} compact />
                          <div style={{ padding: 10, borderTop: "1px solid " + HAIR }}>
                            <div style={{ fontFamily: DISPLAY, fontSize: 14, lineHeight: 1.2 }}>{i + 1}. {x.entry.name}</div>
                            <div style={{ marginTop: 3 }}><Eyebrow>{x.entry.playerName}, {x.votes} votes</Eyebrow></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function Profile({ state, me, now, onRename, onDelete, onEdit, isHost, onHostIn, onHostOut, onSignOut, onModel }) {
  const [nameDraft, setNameDraft] = useState(me.name);
  const [code, setCode] = useState("");
  const [codeErr, setCodeErr] = useState(false);
  const [showPin, setShowPin] = useState(false);
  const [editModel, setEditModel] = useState(false);
  const mine = liveEntries(state).filter((e) => e.playerId === me.id).sort((a, b) => b.createdAt - a.createdAt);
  const wins = state.rounds.filter((r) => {
    const w = r.winnerEntryId && state.entries.find((e) => e.id === r.winnerEntryId);
    return w && w.playerId === me.id;
  });
  const votesReceived = mine.reduce((s, e) => s + tallyFor(state, e.id), 0);
  const votesCast = liveVotes(state).filter((v) => v.playerId === me.id).length;
  const round = currentRound(state);
  const phase = phaseOf(round, now);
  const adv = advantageFor(state, me.id, round.number);

  return (
    <div>
      <div style={{ padding: "24px 0 18px" }}>
        <Eyebrow>Your file</Eyebrow>
        <h2 style={{ fontFamily: DISPLAY, fontSize: "clamp(32px, 9vw, 54px)", lineHeight: 1, marginTop: 10, fontWeight: 500 }}>{me.name}</h2>
      </div>

      <Rule />

      <div className="grid grid-cols-3" style={{ borderBottom: "1px solid " + HAIR }}>
        {[[mine.length, "Looks"], [wins.length, "Wins"], [votesReceived, "Votes won"]].map(([v, l], i) => (
          <div key={l} style={{ padding: "18px 0 18px " + (i ? "16px" : "0"), borderRight: i < 2 ? "1px solid " + HAIR : "none" }}>
            <div style={{ fontFamily: DISPLAY, fontSize: 36, lineHeight: 1 }}>{v}</div>
            <div style={{ marginTop: 6 }}><Eyebrow>{l}</Eyebrow></div>
          </div>
        ))}
      </div>

      <div style={{ marginTop: 24 }}>
        <Eyebrow>Advantages</Eyebrow>
        {adv ? (
          <div style={{ border: "1px solid " + SPOT, padding: 16, marginTop: 10 }}>
            <div style={{ fontFamily: DISPLAY, fontSize: 21 }}>{ADVANTAGES[adv].name}</div>
            <p style={{ fontFamily: UI, fontSize: 13.5, color: GRAPHITE, marginTop: 6, lineHeight: 1.55 }}>
              Active in round {round.number}. {ADVANTAGES[adv].blurb}
            </p>
          </div>
        ) : (
          <p style={{ fontFamily: UI, fontSize: 13.5, color: GRAPHITE, marginTop: 8, lineHeight: 1.6, maxWidth: "46ch" }}>
            None active. Win a round and you pick one for the week after.
          </p>
        )}
      </div>

      <div style={{ marginTop: 34 }}>
        <Eyebrow>Your looks</Eyebrow>
        {mine.length === 0 ? (
          <p style={{ fontFamily: DISPLAY, fontSize: 22, lineHeight: 1.35, marginTop: 12, maxWidth: "30ch" }}>
            Nothing here yet. The wardrobe is open, go build something.
          </p>
        ) : (
          <div className="grid grid-cols-2 sm:grid-cols-3" style={{ gap: 14, marginTop: 14 }}>
            {mine.map((e) => {
              const r = state.rounds.find((x) => x.id === e.roundId);
              const editable = r && r.id === round.id && (phase === "design" || phase === "preview");
              return (
                <div key={e.id} style={{ border: "1px solid " + HAIR }}>
                  <LookCard entry={e} compact />
                  <div style={{ padding: 10, borderTop: "1px solid " + HAIR }}>
                    <div style={{ fontFamily: DISPLAY, fontSize: 15, lineHeight: 1.2 }}>{e.name}</div>
                    <div style={{ marginTop: 4 }}>
                      <Eyebrow>{r ? r.theme : "No round"}</Eyebrow>
                      <div style={{ fontFamily: UI, fontSize: 12, color: GRAPHITE, marginTop: 3 }}>{tallyFor(state, e.id)} votes</div>
                    </div>
                    {editable && (
                      <div className="flex" style={{ gap: 6, marginTop: 10 }}>
                        <Button small kind="quiet" onClick={() => onEdit(e)}>Edit</Button>
                        <Button small kind="quiet" onClick={() => onDelete(e.id)}>Delete</Button>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div style={{ marginTop: 36, borderTop: "1px solid " + HAIR, paddingTop: 20 }}>
        <div className="flex items-center justify-between" style={{ gap: 12 }}>
          <Eyebrow>Your model</Eyebrow>
          <Button small kind="quiet" onClick={() => setEditModel(!editModel)}>{editModel ? "Done" : "Change"}</Button>
        </div>
        <div className="flex items-start" style={{ gap: 16, marginTop: 12 }}>
          <div style={{ width: 110, flex: "0 0 auto", background: CARD, border: "1px solid " + HAIR, padding: 8 }}>
            <Model model={me.model} items={{}} style={{ width: "100%", display: "block" }} />
          </div>
          {!editModel && (
            <p style={{ fontFamily: UI, fontSize: 13, color: GRAPHITE, lineHeight: 1.6 }}>
              This is who walks for you by default. Each look you submit keeps the model you styled it on.
            </p>
          )}
        </div>
        {editModel && (
          <div style={{ marginTop: 14 }}>
            <ModelEditor model={me.model} onChange={onModel} />
          </div>
        )}
      </div>

      <div style={{ marginTop: 36, borderTop: "1px solid " + HAIR, paddingTop: 20 }}>
        <Eyebrow>Your pin</Eyebrow>
        <div className="flex items-center justify-between" style={{ gap: 12, marginTop: 10 }}>
          <div style={{ fontFamily: DISPLAY, fontSize: 34, letterSpacing: "0.34em", lineHeight: 1 }}>
            {showPin ? me.pin || "----" : "••••"}
          </div>
          <Button small kind="quiet" onClick={() => setShowPin(!showPin)}>{showPin ? "Hide" : "Show"}</Button>
        </div>
        <p style={{ fontFamily: UI, fontSize: 12.5, color: GRAPHITE, marginTop: 10, lineHeight: 1.6, maxWidth: "46ch" }}>
          Type this on any phone to pick up your looks, wins and advantages. Anyone who knows it can play as you, so keep it to yourself.
        </p>
        <div style={{ marginTop: 12 }}>
          <Button small kind="quiet" onClick={() => { if (window.confirm("Sign out? You'll need your pin to get back in.")) onSignOut(); }}>
            Sign out of this device
          </Button>
        </div>
      </div>

      <div style={{ marginTop: 40 }}>
        <Eyebrow>Display name</Eyebrow>
        <div className="flex" style={{ gap: 8, marginTop: 10 }}>
          <input
            value={nameDraft}
            onChange={(ev) => setNameDraft(ev.target.value.slice(0, 28))}
            style={{ flex: "1 1 auto", fontFamily: DISPLAY, fontSize: 18, padding: "8px 0", background: "transparent", border: "none", borderBottom: "1px solid " + INK, outline: "none", minWidth: 0 }}
          />
          <Button small kind="ghost" onClick={() => onRename(nameDraft.trim())} disabled={!nameDraft.trim()}>Save</Button>
        </div>
        <p style={{ fontFamily: UI, fontSize: 12.5, color: GRAPHITE, marginTop: 18, lineHeight: 1.6 }}>Votes cast so far: {votesCast}.</p>
      </div>

      <div style={{ marginTop: 34, borderTop: "1px solid " + HAIR, paddingTop: 20 }}>
        <Eyebrow>Host access</Eyebrow>
        {isHost ? (
          <div style={{ marginTop: 10 }}>
            <p style={{ fontFamily: UI, fontSize: 13, color: GRAPHITE, marginBottom: 10 }}>You are running this season.</p>
            <Button small kind="quiet" onClick={onHostOut}>Leave host mode</Button>
          </div>
        ) : (
          <div style={{ marginTop: 10 }}>
            <div className="flex" style={{ gap: 8 }}>
              <input
                value={code}
                onChange={(e) => { setCode(e.target.value); setCodeErr(false); }}
                placeholder="Host passphrase"
                type="password"
                style={{ flex: "1 1 auto", fontFamily: UI, fontSize: 14, padding: "8px 0", background: "transparent", border: "none", borderBottom: "1px solid " + HAIR, outline: "none", minWidth: 0 }}
              />
              <Button small kind="ghost" onClick={() => { if (code === HOST_CODE) onHostIn(); else setCodeErr(true); }}>Unlock</Button>
            </div>
            {codeErr && <p style={{ fontFamily: UI, fontSize: 12.5, color: SPOT, marginTop: 8 }}>That passphrase doesn't match. Ask whoever set the season up.</p>}
          </div>
        )}
      </div>
    </div>
  );
}

function HostPanel({ state, now, onRound, onPatch, onReset, onImport, onSeason, sync }) {
  const round = currentRound(state);
  const phase = phaseOf(round, now);
  const [theme, setTheme] = useState(round.theme);
  const [brief, setBrief] = useState(round.brief);
  const [closes, setCloses] = useState(toLocalInput(round.closesAt));
  const [voteCloses, setVoteCloses] = useState(toLocalInput(round.voteClosesAt));
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);

  useEffect(() => {
    setTheme(round.theme);
    setBrief(round.brief);
    setCloses(toLocalInput(round.closesAt));
    setVoteCloses(toLocalInput(round.voteClosesAt));
  }, [round.id]);

  function flash(t) {
    setMsg(t);
    setTimeout(() => setMsg(null), 2500);
  }

  function saveRound() {
    onPatch({
      theme: theme.trim() || round.theme,
      brief: brief.trim(),
      closesAt: new Date(closes).getTime(),
      voteClosesAt: new Date(voteCloses).getTime(),
    });
    flash("Round updated.");
  }

  function exportJson() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "runway-season.json";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importJson(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed.rounds) throw new Error("bad");
        onImport(parsed);
        flash("Season imported.");
      } catch (err) {
        flash("That file isn't a Runway season.");
      }
    };
    reader.readAsText(f);
  }

  const ranked = rankEntries(state, round.id);
  const season = state.season || { number: 1, target: SEASON_TARGET };
  const doneRounds = state.rounds.filter((r) => (r.seasonNumber || 1) === season.number && r.winnerEntryId).length;

  return (
    <div>
      <div style={{ padding: "24px 0 18px" }}>
        <Eyebrow color={SPOT}>Host</Eyebrow>
        <h2 style={{ fontFamily: DISPLAY, fontSize: "clamp(30px, 8vw, 48px)", lineHeight: 1, marginTop: 10, fontWeight: 500 }}>Run the season</h2>
        <p style={{ fontFamily: UI, fontSize: 13.5, color: GRAPHITE, marginTop: 10, lineHeight: 1.6, maxWidth: "50ch" }}>
          Round {round.number} is in the {PHASE_LABEL[phase].toLowerCase()} phase with {entriesFor(state, round.id).length} entries.
          Shared state is {sync ? "live for every player." : "not reachable, so changes stay on this device."}
        </p>
      </div>

      <Rule />

      <div style={{ padding: "22px 0" }}>
        <Eyebrow>Move the round along</Eyebrow>
        <div className="flex flex-wrap" style={{ gap: 8, marginTop: 12 }}>
          <Button small kind="quiet" disabled={phase !== "design" && phase !== "preview"} onClick={() => { onRound("close-entries"); flash("Entries closed, voting is open."); }}>
            Close entries, start voting
          </Button>
          <Button small kind="quiet" disabled={phase !== "voting"} onClick={() => { onRound("close-voting"); flash("Voting closed."); }}>
            Close voting
          </Button>
          <Button small kind="quiet" disabled={phase === "results"} onClick={() => { onRound("extend"); flash("Deadline pushed a day."); }}>
            Add a day
          </Button>
          <Button small kind="spot" disabled={phase !== "results" || !round.advantage} onClick={() => { onRound("next-round"); flash("Round " + (round.number + 1) + " is live."); }}>
            Start round {round.number + 1}
          </Button>
        </div>
        {phase === "results" && !round.advantage && (
          <p style={{ fontFamily: UI, fontSize: 12.5, color: SPOT, marginTop: 10 }}>
            Pick the advantage on the results screen first, then the next round can open.
          </p>
        )}
      </div>

      <Rule />

      <div style={{ padding: "22px 0" }}>
        <Eyebrow>This round's brief</Eyebrow>
        <div style={{ marginTop: 14 }}>
          <Field label="Theme" value={theme} onChange={setTheme} big />
          <label style={{ display: "block", marginBottom: 14 }}>
            <Eyebrow>Brief</Eyebrow>
            <textarea
              value={brief}
              onChange={(e) => setBrief(e.target.value)}
              rows={2}
              style={{ width: "100%", fontFamily: UI, fontSize: 14, lineHeight: 1.5, padding: "8px 0", background: "transparent", border: "none", borderBottom: "1px solid " + INK, outline: "none", resize: "none", marginTop: 4 }}
            />
          </label>
          <Field label="Entries close" value={closes} onChange={setCloses} type="datetime-local" />
          <Field label="Voting closes" value={voteCloses} onChange={setVoteCloses} type="datetime-local" />
          <Button small kind="ghost" onClick={saveRound}>Save round</Button>
        </div>
      </div>

      <Rule />

      <div style={{ padding: "22px 0" }}>
        <Eyebrow>The season</Eyebrow>
        <p style={{ fontFamily: UI, fontSize: 13, color: GRAPHITE, marginTop: 8, lineHeight: 1.6, maxWidth: "50ch" }}>
          Season {season.number}, {doneRounds} of {season.target} rounds scored.
          {season.championId ? " " + season.championName + " has been crowned." : " Crown a champion whenever you like — it doesn't stop play."}
        </p>
        <div className="flex flex-wrap" style={{ gap: 8, marginTop: 12 }}>
          <Button small kind="quiet" onClick={() => { onSeason("target", season.target - 1); }} disabled={season.target <= 1}>Shorter season</Button>
          <Button small kind="quiet" onClick={() => { onSeason("target", season.target + 1); }}>Longer season</Button>
          <Button small kind="spot" disabled={!!season.championId || doneRounds === 0} onClick={() => { onSeason("crown"); flash("Champion crowned."); }}>
            Crown the champion
          </Button>
          <Button small kind="quiet" disabled={!season.championId} onClick={() => { onSeason("next"); flash("Season " + (season.number + 1) + " has begun."); }}>
            Start season {season.number + 1}
          </Button>
        </div>
      </div>

      <Rule />

      <div style={{ padding: "22px 0" }}>
        <Eyebrow>Live standings</Eyebrow>
        {ranked.length === 0 ? (
          <p style={{ fontFamily: UI, fontSize: 13.5, color: GRAPHITE, marginTop: 10 }}>No entries in this round yet.</p>
        ) : (
          <div style={{ marginTop: 10 }}>
            {ranked.map((r, i) => (
              <div key={r.entry.id} className="flex items-center justify-between" style={{ padding: "10px 0", borderBottom: "1px solid " + HAIR, gap: 12 }}>
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontFamily: DISPLAY, fontSize: 16 }}>{i + 1}. {r.entry.name}</div>
                  <div style={{ marginTop: 2 }}><Eyebrow>{r.entry.playerName}</Eyebrow></div>
                </div>
                <div style={{ fontFamily: DISPLAY, fontSize: 18, color: SPOT }}>{r.votes}</div>
              </div>
            ))}
          </div>
        )}
        <p style={{ fontFamily: UI, fontSize: 12.5, color: GRAPHITE, marginTop: 10 }}>
          Remove an individual entry from the gallery screen.
        </p>
      </div>

      <Rule />

      <div style={{ padding: "22px 0 40px" }}>
        <Eyebrow>Season data</Eyebrow>
        <div className="flex flex-wrap" style={{ gap: 8, marginTop: 12 }}>
          <Button small kind="quiet" onClick={exportJson}>Download backup</Button>
          <Button small kind="quiet" onClick={() => fileRef.current && fileRef.current.click()}>Restore from file</Button>
          <Button small kind="quiet" onClick={() => { if (window.confirm("Wipe every round, entry and vote, and start Season One again?")) onReset(); }}>
            Reset season
          </Button>
        </div>
        <input ref={fileRef} type="file" accept="application/json" onChange={importJson} style={{ display: "none" }} />
        <p style={{ fontFamily: UI, fontSize: 12.5, color: GRAPHITE, marginTop: 14, lineHeight: 1.6, maxWidth: "50ch" }}>
          {state.rounds.length} rounds, {liveEntries(state).length} looks, {liveVotes(state).length} votes,{" "}
          {Object.keys(state.players).length} players on file.
        </p>
        {msg && <p style={{ fontFamily: UI, fontSize: 13, color: SPOT, marginTop: 12 }}>{msg}</p>}
      </div>
    </div>
  );
}

function PinBoxes({ value, onChange, autoFocus }) {
  return (
    <input
      value={value}
      onChange={(e) => onChange(e.target.value.replace(/[^0-9]/g, "").slice(0, 4))}
      inputMode="numeric"
      autoComplete="off"
      autoFocus={autoFocus}
      placeholder="0000"
      style={{
        width: "100%", fontFamily: DISPLAY, fontSize: 44, letterSpacing: "0.4em",
        padding: "10px 0", background: "transparent", border: "none",
        borderBottom: "1px solid " + INK, outline: "none", marginTop: 6,
      }}
    />
  );
}

function Gate({ onCreate, onReturn, error, busy, onClear }) {
  const [mode, setMode] = useState("choose");
  const [name, setName] = useState("");
  const [pin, setPin] = useState("");
  const [pin2, setPin2] = useState("");

  const go = (m) => { onClear(); setMode(m); setPin(""); setPin2(""); };

  return (
    <div className="flex items-center justify-center" style={{ minHeight: "100vh", background: PAPER, padding: 24 }}>
      <div style={{ width: "100%", maxWidth: 420 }}>
        <div style={{ fontFamily: DISPLAY, fontSize: 13, letterSpacing: "0.4em" }}>SEASON ONE</div>
        <h1 style={{ fontFamily: DISPLAY, fontSize: "clamp(52px, 17vw, 88px)", lineHeight: 0.88, letterSpacing: "-0.03em", marginTop: 10, fontWeight: 500 }}>
          Runway
        </h1>

        {mode === "choose" && (
          <div>
            <p style={{ fontFamily: DISPLAY, fontStyle: "italic", fontSize: 19, lineHeight: 1.5, marginTop: 18, maxWidth: "30ch" }}>
              A new brief every week. One shared wardrobe, everyone in the same game, and the gallery decides.
            </p>
            <div style={{ marginTop: 34 }}>
              <Button full onClick={() => go("create")}>I'm new here</Button>
            </div>
            <div style={{ marginTop: 10 }}>
              <Button full kind="ghost" onClick={() => go("return")}>I have a pin</Button>
            </div>
          </div>
        )}

        {mode === "create" && (
          <div>
            <p style={{ fontFamily: UI, fontSize: 14, lineHeight: 1.6, color: GRAPHITE, marginTop: 18, maxWidth: "38ch" }}>
              Pick a name and a four digit pin. The pin is how you get back to your looks, your wins and your model — on this phone or any other.
            </p>
            <div style={{ marginTop: 26 }}>
              <Eyebrow>Your name</Eyebrow>
              <input
                value={name}
                onChange={(e) => { onClear(); setName(e.target.value.slice(0, 28)); }}
                placeholder="Your name"
                style={{ width: "100%", fontFamily: DISPLAY, fontSize: 26, padding: "10px 0", background: "transparent", border: "none", borderBottom: "1px solid " + INK, outline: "none", marginTop: 6 }}
              />
            </div>
            <div style={{ marginTop: 22 }}>
              <Eyebrow>Choose a pin</Eyebrow>
              <PinBoxes value={pin} onChange={(v) => { onClear(); setPin(v); }} />
            </div>
            <div style={{ marginTop: 18 }}>
              <Eyebrow>Type it once more</Eyebrow>
              <PinBoxes value={pin2} onChange={(v) => { onClear(); setPin2(v); }} />
            </div>
            {pin.length === 4 && pin2.length === 4 && pin !== pin2 && (
              <p style={{ fontFamily: UI, fontSize: 13, color: SPOT, marginTop: 12 }}>Those two pins don't match.</p>
            )}
            {error && <p style={{ fontFamily: UI, fontSize: 13, color: SPOT, marginTop: 12 }}>{error}</p>}
            <div style={{ marginTop: 22 }}>
              <Button full disabled={busy || !name.trim() || pin.length !== 4 || pin !== pin2} onClick={() => onCreate(name.trim(), pin)}>
                {busy ? "One moment" : "Save my pin and start"}
              </Button>
            </div>
            <div style={{ marginTop: 10 }}>
              <Button full kind="quiet" onClick={() => go("choose")}>Back</Button>
            </div>
            <p style={{ fontFamily: UI, fontSize: 12.5, color: GRAPHITE, marginTop: 16, lineHeight: 1.6 }}>
              Write the pin down somewhere. Nobody can look it up for you.
            </p>
          </div>
        )}

        {mode === "return" && (
          <div>
            <p style={{ fontFamily: UI, fontSize: 14, lineHeight: 1.6, color: GRAPHITE, marginTop: 18, maxWidth: "38ch" }}>
              Type the four digit pin you made and everything comes back.
            </p>
            <div style={{ marginTop: 26 }}>
              <Eyebrow>Your pin</Eyebrow>
              <PinBoxes value={pin} onChange={(v) => { onClear(); setPin(v); }} autoFocus />
            </div>
            {error && <p style={{ fontFamily: UI, fontSize: 13, color: SPOT, marginTop: 12 }}>{error}</p>}
            <div style={{ marginTop: 22 }}>
              <Button full disabled={busy || pin.length !== 4} onClick={() => onReturn(pin)}>
                {busy ? "Looking" : "Let me in"}
              </Button>
            </div>
            <div style={{ marginTop: 10 }}>
              <Button full kind="quiet" onClick={() => go("choose")}>Back</Button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */

function App() {
  const [state, setState] = useState(null);
  const [me, setMe] = useState(null);
  const [isHost, setIsHost] = useState(false);
  const [tab, setTab] = useState("round");
  const [now, setNow] = useState(Date.now());
  const [ready, setReady] = useState(false);
  const [editing, setEditing] = useState(null);
  const [online, setOnline] = useState(false);
  const [preset, setPreset] = useState(null);
  const [gateError, setGateError] = useState(null);
  const [gateBusy, setGateBusy] = useState(false);
  const stateRef = useRef(null);
  stateRef.current = state;

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  // boot
  useEffect(() => {
    (async () => {
      const params = new URLSearchParams(location.search);
      if (params.get("host") === HOST_CODE) {
        localStorage.setItem(HKEY, "1");
        history.replaceState({}, "", location.pathname);
      }
      setIsHost(localStorage.getItem(HKEY) === "1");

      const local = Sync.local();
      const remote = await Sync.pull();
      setOnline(Sync.online);

      let s;
      if (remote && local) s = mergeState(local, remote);
      else s = remote || local || buildSeed();
      setState(s);
      Sync.push(s);

      try {
        const p = localStorage.getItem(PKEY);
        if (p) setMe(JSON.parse(p));
      } catch (e) {}
      setReady(true);
    })();
  }, []);

  // poll for other players
  useEffect(() => {
    const t = setInterval(async () => {
      const remote = await Sync.pull();
      setOnline(Sync.online);
      if (!remote) return;
      const merged = mergeState(stateRef.current, remote);
      if (JSON.stringify(merged) !== JSON.stringify(stateRef.current)) setState(merged);
    }, 6000);
    return () => clearInterval(t);
  }, []);

  function save(next) {
    setState(next);
    Sync.push(next).then((merged) => {
      if (merged && merged !== next) setState((cur) => mergeState(cur, merged));
    });
  }

  useEffect(() => {
    if (!state) return;
    const next = autoFinalize(state, now);
    if (next) save(next);
  }, [state, Math.floor(now / 5000)]);

  if (!ready) return <div className="boot">LOADING SEASON ONE</div>;

  async function freshest() {
    const remote = await Sync.pull();
    setOnline(Sync.online);
    return remote ? mergeState(stateRef.current, remote) : stateRef.current;
  }

  async function createPlayer(name, pin) {
    setGateBusy(true);
    const merged = await freshest();
    setState(merged);
    const taken = Object.keys(merged.players).some((k) => merged.players[k].pin === pin);
    if (taken) {
      setGateError("Someone already has the pin " + pin + ". Pick a different one.");
      setGateBusy(false);
      return;
    }
    const player = { id: "pin-" + pin, name, pin, model: Object.assign({}, DEFAULT_MODEL), joinedAt: Date.now(), updatedAt: Date.now() };
    const next = Object.assign({}, merged, { players: Object.assign({}, merged.players, { [player.id]: player }) });
    const written = await Sync.push(next);
    setState(written || next);
    const owner = (written || next).players[player.id];
    if (owner && owner.pin === pin && owner.name !== name) {
      setGateError("Someone claimed the pin " + pin + " a moment before you. Pick a different one.");
      setGateBusy(false);
      return;
    }
    localStorage.setItem(PKEY, JSON.stringify(player));
    setMe(player);
    setGateBusy(false);
  }

  async function signIn(pin) {
    setGateBusy(true);
    const merged = await freshest();
    setState(merged);
    const key = Object.keys(merged.players).find((k) => merged.players[k].pin === pin);
    if (!key) {
      setGateError("No player has the pin " + pin + " yet. Check the digits, or start as someone new.");
      setGateBusy(false);
      return;
    }
    const player = merged.players[key];
    localStorage.setItem(PKEY, JSON.stringify(player));
    setMe(player);
    setGateBusy(false);
  }

  if (!me)
    return (
      <Gate
        onCreate={createPlayer}
        onReturn={signIn}
        error={gateError}
        busy={gateBusy}
        onClear={() => gateError && setGateError(null)}
      />
    );

  const round = currentRound(state);
  const phase = phaseOf(round, now);

  function saveModel(model) {
    const player = Object.assign({}, me, { model: model, updatedAt: Date.now() });
    setMe(player);
    localStorage.setItem(PKEY, JSON.stringify(player));
    return player;
  }

  function submitLook({ name, caption, items, colors, model }) {
    const clean = {};
    Object.keys(items).forEach((k) => { if (items[k]) clean[k] = items[k]; });
    const tint = {};
    Object.keys(colors || {}).forEach((k) => { if (clean[k]) tint[k] = colors[k]; });
    const player = saveModel(model);
    if (editing) {
      const entries = state.entries.map((e) =>
        e.id === editing.id
          ? Object.assign({}, e, { name, caption, items: clean, colors: tint, model, updatedAt: Date.now() })
          : e
      );
      save(Object.assign({}, state, {
        entries,
        players: Object.assign({}, state.players, { [me.id]: player }),
      }));
      setEditing(null);
      return;
    }
    const entry = {
      id: uid("e"),
      roundId: round.id,
      playerId: me.id,
      playerName: me.name,
      name, caption,
      items: clean,
      colors: tint,
      model,
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    save(Object.assign({}, state, {
      entries: state.entries.concat([entry]),
      players: Object.assign({}, state.players, { [me.id]: player }),
    }));
    setPreset(null);
  }

  function toggleVote(entryId, category) {
    const target = state.entries.find((e) => e.id === entryId);
    if (!target || target.playerId === me.id) return; // never your own look
    const cat = category || "main";
    const id = entryId + "|" + me.id + "|" + cat;
    const existing = state.votes.find((v) => v.id === id);
    const active = existing && !existing.removed;
    if (!active && votesLeft(state, me.id, round.id, cat) === 0) return;
    const weight = cat === "main" && advantageFor(state, me.id, round.number) === "double_vote" ? 2 : 1;
    const vote = {
      id, roundId: round.id, entryId, playerId: me.id, category: cat,
      weight, at: Date.now(), removed: !!active,
    };
    save(Object.assign({}, state, { votes: state.votes.filter((v) => v.id !== id).concat([vote]) }));
  }

  function toggleReaction(entryId, emoji) {
    const id = entryId + "|" + me.id + "|" + emoji;
    const list = state.reactions || [];
    const existing = list.find((r) => r.id === id);
    const r = {
      id, roundId: round.id, entryId, playerId: me.id, emoji,
      at: Date.now(), removed: !!(existing && !existing.removed),
    };
    save(Object.assign({}, state, { reactions: list.filter((x) => x.id !== id).concat([r]) }));
  }

  function seasonAction(action, value) {
    const season = Object.assign({ number: 1, target: SEASON_TARGET }, state.season || {});
    if (action === "target") {
      save(Object.assign({}, state, { season: Object.assign({}, season, { target: value, updatedAt: Date.now() }) }));
      return;
    }
    if (action === "crown") {
      const table = standings(state, season.number);
      if (!table.length) return;
      const champ = table[0];
      save(Object.assign({}, state, {
        season: Object.assign({}, season, {
          championId: champ.playerId, championName: champ.name, endedAt: Date.now(), updatedAt: Date.now(),
        }),
      }));
      return;
    }
    if (action === "next") {
      const table = standings(state, season.number);
      const champ = table[0];
      const entry = {
        id: "hof-" + season.number,
        season: season.number,
        championId: season.championId || (champ && champ.playerId) || null,
        championName: season.championName || (champ && champ.name) || "Nobody",
        points: champ ? champ.points : 0,
        at: Date.now(),
      };
      save(Object.assign({}, state, {
        halloffame: (state.halloffame || []).filter((h) => h.id !== entry.id).concat([entry]),
        season: { number: season.number + 1, target: season.target, championId: null, championName: null, updatedAt: Date.now() },
      }));
      setTab("round");
    }
  }

  function claimAdvantage(roundId, type, payload, winnerId) {
    const rounds = state.rounds.map((r) =>
      r.id === roundId
        ? Object.assign({}, r, { advantage: { type, playerId: winnerId, claimedAt: Date.now(), payload: payload || null }, updatedAt: Date.now() })
        : r
    );
    save(Object.assign({}, state, { rounds }));
  }

  function removeEntry(id) {
    save(Object.assign({}, state, {
      entries: state.entries.map((e) => (e.id === id ? Object.assign({}, e, { deleted: true, updatedAt: Date.now() }) : e)),
    }));
  }

  function rename(name) {
    const player = Object.assign({}, me, { name: name, updatedAt: Date.now() });
    setMe(player);
    localStorage.setItem(PKEY, JSON.stringify(player));
    save(Object.assign({}, state, {
      players: Object.assign({}, state.players, { [me.id]: player }),
      entries: state.entries.map((e) => (e.playerId === me.id ? Object.assign({}, e, { playerName: name, updatedAt: Date.now() }) : e)),
    }));
  }

  function patchRound(patch) {
    const rounds = state.rounds.map((r) => (r.id === round.id ? Object.assign({}, r, patch, { updatedAt: Date.now() }) : r));
    save(Object.assign({}, state, { rounds }));
  }

  function runRound(action) {
    const t = Date.now();
    if (action === "close-entries") {
      const sunday = weekOf(t).voteClosesAt;
      patchRound({
        opensAt: Math.min(round.opensAt, t),
        closesAt: t,
        voteClosesAt: sunday > t + 3600000 ? sunday : t + DAY,
      });
      setTab("gallery");
    }
    if (action === "extend") {
      patchRound(
        phase === "voting"
          ? { voteClosesAt: round.voteClosesAt + DAY }
          : { closesAt: round.closesAt + DAY, voteClosesAt: round.voteClosesAt + DAY }
      );
    }
    if (action === "close-voting") {
      const ranked = rankEntries(state, round.id);
      patchRound({ voteClosesAt: t, winnerEntryId: ranked.length ? ranked[0].entry.id : null });
      setTab("results");
    }
    if (action === "next-round") {
      const adv = round.advantage;
      const themed = adv && adv.type === "theme_control" && adv.payload;
      const early = adv && adv.type === "early_access";
      const used = state.rounds.map((r) => r.theme);
      const pool = THEME_POOL.filter((x) => used.indexOf(x) === -1);
      const w = nextRoundWindow(t);
      const opens = w.opensAt;
      const next = {
        id: uid("r"),
        number: round.number + 1,
        theme: themed || pool[0] || THEME_POOL[0],
        brief: themed ? "Set by last week's winner. Interpret it however you like." : "Seven days. Five looks. Same wardrobe as everyone else.",
        themeSetBy: themed ? adv.playerId : null,
        previewAt: early ? opens - DAY : opens,
        opensAt: early ? Math.max(opens, t + DAY) : opens,
        closesAt: w.closesAt,
        voteClosesAt: w.voteClosesAt,
        winnerEntryId: null,
        advantage: null,
        seasonNumber: (state.season && state.season.number) || 1,
        updatedAt: t,
      };
      save(Object.assign({}, state, { rounds: state.rounds.concat([next]) }));
      setTab("round");
    }
  }

  function resetSeason() {
    const fresh = buildSeed();
    fresh.epoch = Date.now();
    if (state.players[me.id]) fresh.players[me.id] = state.players[me.id];
    setState(fresh);
    Sync.replace(fresh);
    setTab("round");
  }

  const tabs = [
    ["round", "Round"],
    ["studio", "Studio"],
    ["gallery", "Gallery"],
    ["results", "Results"],
    ["profile", "You"],
  ].concat(isHost ? [["host", "Host"]] : []);

  const screen = {
    round: <RoundHome state={state} me={me} now={now} isHost={isHost} go={(t) => { setEditing(null); setPreset(null); setTab(t); }} />,
    studio: (
      <Studio
        key={editing ? editing.id : preset ? "remix-" + preset.id : "new"}
        state={state} me={me} now={now} editing={editing} preset={preset}
        onCancelEdit={() => { setEditing(null); setPreset(null); setTab("profile"); }}
        onSubmit={submitLook}
      />
    ),
    gallery: (
      <Gallery
        state={state} me={me} now={now}
        onVote={toggleVote}
        onReact={toggleReaction}
        onRestyle={(e) => { setEditing(null); setPreset(e); setTab("studio"); }}
        isHost={isHost} onRemove={removeEntry}
      />
    ),
    results: (
      <Results
        state={state} me={me} now={now} onClaim={claimAdvantage} isHost={isHost}
        onRestyle={(e) => { setEditing(null); setPreset(e); setTab("studio"); }}
      />
    ),
    profile: (
      <Profile
        state={state} me={me} now={now}
        onRename={rename} onDelete={removeEntry}
        onEdit={(e) => { setPreset(null); setEditing(e); setTab("studio"); }}
        isHost={isHost}
        onHostIn={() => { localStorage.setItem(HKEY, "1"); setIsHost(true); setTab("host"); }}
        onHostOut={() => { localStorage.removeItem(HKEY); setIsHost(false); setTab("round"); }}
        onSignOut={() => { localStorage.removeItem(PKEY); setMe(null); setTab("round"); }}
        onModel={(model) => {
          const player = saveModel(model);
          save(Object.assign({}, state, { players: Object.assign({}, state.players, { [me.id]: player }) }));
        }}
      />
    ),
    host: isHost ? (
      <HostPanel
        state={state} now={now} sync={online}
        onRound={runRound} onPatch={patchRound} onReset={resetSeason} onSeason={seasonAction}
        onImport={(s) => save(mergeState(null, s))}
      />
    ) : null,
  }[tab];

  return (
    <div style={{ background: PAPER, color: INK, minHeight: "100vh" }}>
      <div style={{ maxWidth: 1180, margin: "0 auto", padding: "0 20px 120px" }}>
        <header style={{ paddingTop: 22 }}>
          <div className="flex items-baseline justify-between" style={{ gap: 16 }}>
            <div style={{ fontFamily: DISPLAY, fontSize: 30, letterSpacing: "-0.01em", fontWeight: 600, lineHeight: 1 }}>Runway</div>
            <div style={{ textAlign: "right" }}>
              <Eyebrow color={isHost ? SPOT : GRAPHITE}>
                {isHost ? "Host mode, " : "Season one, "}{PHASE_LABEL[phase].toLowerCase()}
              </Eyebrow>
              <div style={{ fontFamily: UI, fontSize: 10, letterSpacing: "0.14em", textTransform: "uppercase", color: online ? GRAPHITE : "#B4AFA5", marginTop: 3 }}>
                {online ? "Shared" : "This device only"}
              </div>
            </div>
          </div>
          <div style={{ height: 2, background: INK, marginTop: 10 }} />
          <div style={{ height: 1, background: INK, marginTop: 2 }} />

          <nav className="hidden md:flex" style={{ gap: 26, padding: "12px 0", borderBottom: "1px solid " + HAIR }}>
            {tabs.map(([k, label]) => (
              <button
                key={k}
                type="button"
                onClick={() => { setEditing(null); setPreset(null); setTab(k); }}
                style={{ fontFamily: UI, fontSize: 11.5, letterSpacing: "0.16em", textTransform: "uppercase", background: "none", border: "none", padding: "0 0 3px", cursor: "pointer", color: tab === k ? (k === "host" ? SPOT : INK) : GRAPHITE, borderBottom: "2px solid " + (tab === k ? (k === "host" ? SPOT : INK) : "transparent") }}
              >
                {label}
              </button>
            ))}
          </nav>
        </header>

        <main>{screen}</main>

        <footer style={{ marginTop: 60, paddingTop: 18, borderTop: "1px solid " + HAIR }}>
          <Eyebrow>{liveEntries(state).length} looks across {state.rounds.length} rounds</Eyebrow>
        </footer>
      </div>

      <nav className="flex md:hidden" style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: PAPER, borderTop: "1px solid " + INK }}>
        {tabs.map(([k, label]) => (
          <button
            key={k}
            type="button"
            onClick={() => { setEditing(null); setPreset(null); setTab(k); }}
            style={{
              flex: 1,
              padding: "14px 2px calc(14px + env(safe-area-inset-bottom))",
              background: tab === k ? (k === "host" ? SPOT : INK) : "transparent",
              color: tab === k ? "#fff" : k === "host" ? SPOT : GRAPHITE,
              border: "none",
              fontFamily: UI, fontSize: 9.5, letterSpacing: "0.1em", textTransform: "uppercase", cursor: "pointer",
            }}
          >
            {label}
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
