<style>
  :root { --paper:#F1EFEA; --ink:#000; --graphite:#5F5B54; --hair:#CFCAC0; --spot:#1B36C4; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--paper); color:var(--ink);
    -webkit-text-size-adjust:100%; }
  body { font-family:'Archivo', Helvetica, Arial, sans-serif; }
  button, input, textarea, select { font:inherit; color:inherit; border-radius:0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline:2px solid var(--spot); outline-offset:2px; }
  input::placeholder, textarea::placeholder { color:#B4AFA5; }
  .boot { min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-size:12px; letter-spacing:.3em; color:var(--graphite); }

  /* minimal utility layer (replaces Tailwind, no build step) */
  .flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
  .items-center{align-items:center}.items-baseline{align-items:baseline}.items-start{align-items:flex-start}
  .justify-between{justify-content:space-between}.justify-center{justify-content:center}
  .grid{display:grid}
  .grid-cols-1{grid-template-columns:repeat(1,minmax(0,1fr))}
  .grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .order-1{order:1}.order-2{order:2}
  .hidden{display:none}
  @media (min-width:640px){
    .sm\:grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sm\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  @media (min-width:768px){
    .md\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .md\:hidden{display:none}
    .md\:flex{display:flex}
  }
  @media (min-width:1024px){ .lg\:flex-row{flex-direction:row} }
  @media (min-width:1280px){
    .xl\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .xl\:grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  @keyframes walk { from { transform: translateY(14px) scale(0.97); opacity: 0 } to { transform: none; opacity: 1 } }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

function PatternOverlay({ kind, accent, ink }) {
  if (!kind) return null;
  if (kind === "stripe")
    return (
      <g stroke={accent} strokeWidth="4">
        {Array.from({ length: 12 }).map((_, i) => (
          <line key={i} x1="0" y1={i * 9 + 4} x2="100" y2={i * 9 + 4} />
        ))}
      </g>
    );
  if (kind === "check")
    return (
      <g stroke={accent} strokeWidth="2.2" opacity="0.85">
        {Array.from({ length: 7 }).map((_, i) => (
          <line key={"h" + i} x1="0" y1={i * 15 + 8} x2="100" y2={i * 15 + 8} />
        ))}
        {Array.from({ length: 7 }).map((_, i) => (
          <line key={"v" + i} x1={i * 15 + 8} y1="0" x2={i * 15 + 8} y2="100" />
        ))}
      </g>
    );
  if (kind === "pleat")
    return (
      <g stroke={ink} strokeWidth="0.8" opacity="0.45">
        {Array.from({ length: 9 }).map((_, i) => (
          <line key={i} x1={i * 11 + 12} y1="0" x2={i * 11 + 8} y2="100" />
        ))}
      </g>
    );
  if (kind === "dot")
    return (
      <g fill={accent}>
        {Array.from({ length: 40 }).map((_, i) => (
          <circle key={i} cx={(i % 8) * 13 + 6} cy={Math.floor(i / 8) * 13 + 24} r="2" />
        ))}
      </g>
    );
  if (kind === "sequin")
    return (
      <g fill={accent} opacity="0.9">
        {Array.from({ length: 60 }).map((_, i) => {
          const row = Math.floor(i / 10);
          return (
            <circle
              key={i}
              cx={(i % 10) * 10 + (row % 2 ? 8 : 3)}
              cy={row * 10 + 14}
              r="2.6"
            />
          );
        })}
      </g>
    );
  if (kind === "graphic")
    return (
      <g>
        <circle cx="50" cy="46" r="11" fill="none" stroke={accent} strokeWidth="3" />
        <rect x="34" y="58" width="32" height="4" fill={accent} />
      </g>
    );
  return null;
}

function Art({ item, className, style }) {
  const uid = useId().replace(/:/g, "");
  if (!item) return null;
  const shape = SHAPES[item.shape];
  if (!shape) return null;
  const accent = item.accent || GRAPHITE;
  const ctx = { ink: ART, accent, color: item.color };
  return (
    <svg viewBox="0 0 100 100" className={className} style={style} aria-hidden="true">
      {shape.body && (
        <>
          <defs>
            <clipPath id={"c" + uid}>
              <path d={shape.body} />
            </clipPath>
          </defs>
          <path
            d={shape.body}
            fill={item.color}
            stroke={ART}
            strokeWidth="1.25"
            strokeLinejoin="round"
          />
          {item.pattern && (
            <g clipPath={`url(#c${uid})`}>
              <PatternOverlay kind={item.pattern} accent={accent} ink={ART} />
            </g>
          )}
          <path
            d={shape.body}
            fill="none"
            stroke={ART}
            strokeWidth="1.25"
            strokeLinejoin="round"
          />
        </>
      )}
      {shape.details && shape.details(ctx)}
    </svg>
  );
}

/* ---- pattern fill inside the figure's coordinate space ---- */
function FigPattern({ kind, accent }) {
  if (!kind) return null;
  if (kind === "stripe")
    return (
      <g stroke={accent} strokeWidth="5">
        {Array.from({ length: 26 }).map((_, i) => (
          <line key={i} x1="0" y1={i * 10 + 4} x2="120" y2={i * 10 + 4} />
        ))}
      </g>
    );
  if (kind === "check")
    return (
      <g stroke={accent} strokeWidth="2.4" opacity="0.85">
        {Array.from({ length: 18 }).map((_, i) => (
          <line key={"h" + i} x1="0" y1={i * 15 + 6} x2="120" y2={i * 15 + 6} />
        ))}
        {Array.from({ length: 9 }).map((_, i) => (
          <line key={"v" + i} x1={i * 15 + 6} y1="0" x2={i * 15 + 6} y2="260" />
        ))}
      </g>
    );
  if (kind === "pleat")
    return (
      <g stroke={ART} strokeWidth="0.9" opacity="0.4">
        {Array.from({ length: 12 }).map((_, i) => (
          <line key={i} x1={i * 10 + 6} y1="90" x2={i * 10 + 2} y2="260" />
        ))}
      </g>
    );
  if (kind === "dot")
    return (
      <g fill={accent}>
        {Array.from({ length: 130 }).map((_, i) => (
          <circle key={i} cx={(i % 10) * 13 + 5} cy={Math.floor(i / 10) * 20 + 8} r="2.3" />
        ))}
      </g>
    );
  if (kind === "sequin")
    return (
      <g fill={accent} opacity="0.9">
        {Array.from({ length: 208 }).map((_, i) => {
          const row = Math.floor(i / 13);
          return <circle key={i} cx={(i % 13) * 9.5 + (row % 2 ? 8 : 3)} cy={row * 9 + 6} r="2.4" />;
        })}
      </g>
    );
  if (kind === "graphic")
    return (
      <g>
        <circle cx="60" cy="80" r="11" fill="none" stroke={accent} strokeWidth="3" />
        <rect x="45" y="94" width="30" height="4" fill={accent} />
      </g>
    );
  return null;
}

/* ---- a single worn piece: fill, optional pattern, outline ---- */
function Piece({ d, color, pattern, accent, sw, flat }) {
  const id = "p" + useId().replace(/:/g, "");
  const w = sw || 1.3;
  return (
    <g>
      <defs>
        <clipPath id={id}>
          <path d={d} />
        </clipPath>
        {!flat && (
          <linearGradient id={id + "s"} x1="0" y1="0" x2="1" y2="0.25">
            <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.20" />
            <stop offset="38%" stopColor="#FFFFFF" stopOpacity="0.04" />
            <stop offset="72%" stopColor="#000000" stopOpacity="0.05" />
            <stop offset="100%" stopColor="#000000" stopOpacity="0.20" />
          </linearGradient>
        )}
      </defs>
      <path d={d} fill={color} stroke="none" />
      {pattern && (
        <g clipPath={"url(#" + id + ")"}>
          <FigPattern kind={pattern} accent={accent || GRAPHITE} />
        </g>
      )}
      {!flat && <rect x="0" y="-24" width="120" height="292" fill={"url(#" + id + "s)"} clipPath={"url(#" + id + ")"} />}
      <path d={d} fill="none" stroke={ART} strokeWidth={w} strokeLinejoin="round" strokeLinecap="round" />
    </g>
  );
}

);

    );
  // The crown is filled in and the hairline sits just above the brows, with the
  // hair sweeping down past the temples so nobody looks like they're balding.
  if (style === "crop")
    return <path {...P} d="M40,32 C38,10 49,4 60,4 C71,4 82,10 80,32 C78,25 72,21 60,21 C48,21 42,25 40,32 Z" />;
  if (style === "tight")
    return <path {...P} d="M41,28 C39,10 49,3 60,3 C71,3 81,10 79,28 C76,22 70,19 60,19 C50,19 44,22 41,28 Z" />;

  const part = parting || "middle";

/* ---- the whole model ---- */
function Model({ model, items, colors, style, className }) {
  const m = Object.assign({}, DEFAULT_MODEL, model || {});
  const skin = skinOf(m);
  const it = items || {};
  const cols = colors || {};
  const pose = poseOf(m);
  const nail = nailOf(m);

  // A smaller head and slightly longer legs read far less like a cartoon.
  const HEAD_T = "translate(60 53) scale(0.88) translate(-60 -53)";
  const LEG_T = "translate(0 140) scale(1 1.08) translate(0 -140)";

  const Skin = (p) => <Piece d={p.d} color={skin} sw={1.15} />;
  const shade = { fill: "none", stroke: ART, strokeWidth: 0.75, opacity: 0.3, strokeLinecap: "round" };

  const props = (slot) => {
    const item = it[slot] ? BY_ID[it[slot]] : null;
    if (!item) return null;
    return {
      item: item,
      p: { color: cols[slot] || item.color, accent: item.accent || GRAPHITE, pattern: item.pattern },
    };
  };
  const piece = (slot) => {
    const x = props(slot);
    if (!x) return null;
    const render = WORN[x.item.shape];
    return render ? render(x.p) : null;
  };

  const top = props("top");
  const outer = props("outerwear");
  const acc = props("accessory");
  const bag = props("bag");
  const jewel = props("jewellery");
  const bottom = props("bottom");
  const bib = bottom && BIB[bottom.item.shape];
  const onWrist = jewel && WRIST[jewel.item.shape];
  const jewelOnHead = jewel && jewel.item.shape === "hoops";
  const headAcc = ["hat", "headband", "clip", "sunglasses", "hoops", "beanie", "beret", "earmuffs", "goggles"];
  const accOnHead = acc && headAcc.indexOf(acc.item.shape) > -1;
  const gloved = acc && acc.item.shape === "gloves";
  const watched = acc && acc.item.shape === "watch";
  const heldBag = bag && ARM_HELD[bag.item.shape];

  const sleeve = (x, d) => (x && SLEEVED[x.item.shape] ? <Piece {...x.p} d={d} /> : null);
  const nails = (cx, flip) =>
    nail && (
      <g fill={nail} stroke={ART} strokeWidth="0.35">
        <ellipse cx={cx + (flip ? 2.6 : -2.6)} cy="145" rx="1.1" ry="1.4" />
        <ellipse cx={cx} cy="146.2" rx="1.1" ry="1.4" />
        <ellipse cx={cx + (flip ? -2.6 : 2.6)} cy="145.4" rx="1.1" ry="1.4" />
      </g>
    );

  return (
    <svg viewBox="0 -20 120 288" className={className} style={style} aria-hidden="true">
      <g transform={"translate(60 0) scale(" + pose.sx + " 1) translate(-60 0)"}>
        <g transform={"rotate(" + pose.tilt + " 60 240)"}>
          <g transform={"translate(0 252) scale(1 " + heightOf(m) + ") translate(0 -252)"}>
            <g transform={HEAD_T}>
              <HairBack style={m.hair} color={m.hairColor} />
            </g>

            {/* arms */}
            <g transform={ROT_L(pose.aL)}>
              <Skin d="M44,60 C38,66 34,90 31,132 C30,137 33,141 36,141 C39,141 41,138 41,134 C43,98 46,74 50,63 Z" />
              <Skin d="M35,138 C39,138 40,141 40,144 C40,148 38,150 35,150 C32,150 30,148 30,144 C30,141 31,138 35,138 Z" />
              {nails(35, false)}
            </g>
            <g transform={ROT_R(pose.aR)}>
              <Skin d="M76,60 C82,66 86,90 89,132 C90,137 87,141 84,141 C81,141 79,138 79,134 C77,98 74,74 70,63 Z" />
              <Skin d="M85,138 C89,138 90,141 90,144 C90,148 88,150 85,150 C82,150 80,148 80,144 C80,141 81,138 85,138 Z" />
              {nails(85, true)}
            </g>

            {/* legs */}
            <g transform={LEG_T}>
              <Skin d="M44,136 C42,162 42,190 44,214 C45,224 45,230 45,234 L58,234 C58,228 58,222 58,214 C59,190 59,162 59,136 Z" />
              <Skin d="M61,136 C61,162 61,190 62,214 C62,222 62,228 62,234 L75,234 C75,230 75,224 76,214 C78,190 78,162 76,136 Z" />
            </g>

            {/* hips, torso, neck */}
            <Skin d="M44,100 L76,100 C79,114 78,128 77,140 L43,140 C42,128 41,114 44,100 Z" />
            <Skin d="M43,59 Q60,50 77,59 C79,72 76,86 74,96 C73,101 72,104 72,106 L48,106 C48,104 47,101 46,96 C44,86 41,72 43,59 Z" />
            <path {...shade} d="M50,86 C56,90 64,90 70,86" />
            <Skin d="M55,45 L65,45 C65,52 66,56 68,59 L52,59 C54,56 55,52 55,45 Z" />

            {/* head */}
            <g transform={HEAD_T}>
              <Skin d="M60,7 C71,7 78,16 78,29 C78,38 74,45 68,49 C65,51 62,52 60,52 C58,52 55,51 52,49 C46,45 42,38 42,29 C42,16 49,7 60,7 Z" />
              <path {...shade} d="M45,31 C43,31 42,33 43,35 C43,37 45,38 46,37" />
              <path {...shade} d="M75,31 C77,31 78,33 77,35 C77,37 75,38 74,37" />
              <Face makeup={m.makeup} eyeliner={m.eyeliner} glasses={m.glasses} freckles={m.freckles} />
              <HairFront style={m.hair} color={m.hairColor} parting={m.parting} />
            </g>

            {/* clothes */}
            <g transform={LEG_T}>
              {piece("legwear")}
              {piece("bottom")}
              {piece("shoes")}
            </g>
            {piece("top")}
            {bib && BIB[bottom.item.shape](bottom.p)}
            {piece("outerwear")}
            {!accOnHead && !gloved && !watched && piece("accessory")}
            {!heldBag && piece("bag")}
            {jewel && !onWrist && !jewelOnHead && piece("jewellery")}

            {/* sleeves and carried things turn with the arms */}
            <g transform={ROT_L(pose.aL)}>
              {sleeve(top, SLEEVE_L)}
              {sleeve(outer, SLEEVE_L)}
              {gloved && <Piece {...acc.p} d="M31,102 L41,104 L37,143 L27,141 Z" />}
            </g>
            <g transform={ROT_R(pose.aR)}>
              {sleeve(top, SLEEVE_R)}
              {sleeve(outer, SLEEVE_R)}
              {gloved && <Piece {...acc.p} d="M89,102 L79,104 L83,143 L93,141 Z" />}
              {watched && <Piece {...acc.p} d="M80,128 L89,129 L87,140 L78,139 Z" sw={1.1} />}
              {heldBag && WORN[bag.item.shape](bag.p)}
              {onWrist && WRIST[jewel.item.shape](jewel.p)}
            </g>

            <g transform={HEAD_T}>
              {accOnHead && piece("accessory")}
              {jewelOnHead && piece("jewellery")}
            </g>
            <g transform={LEG_T}>{piece("pet")}</g>
          </g>
        </g>
      </g>
    </svg>
  );
}

  ];

  const tallies = {
    e1: 9, e2: 14, e3: 6, e4: 5, e5: 11,
    e6: 12, e7: 10, e8: 17, e9: 7, e10: 9, e11: 8,
  };

    crowd(n).forEach((pid) => {

  return { version: 1, players, rounds, entries, votes, createdAt: now };

function buildSeed() {
  const now = Date.now();
  // A brand new season should be playable the moment it is created, even if it
  // starts mid-week or at the weekend: open now, close on the next Saturday
  // that leaves a proper week to design in.
  const w = nextRoundWindow(now);
  // A minute in the past, so a phone whose clock runs slightly slow doesn't
  // land in the "not open yet" preview state the instant a season is created.
  const opensAt = Math.min(w.opensAt, now - 60000);
  return {
    version: 2,
    epoch: now,
    createdAt: now,
    players: {},
    rounds: [
      {
        id: "r1",
        number: 1,
        theme: "Rainy Day Chic",
        brief: "It is going to rain all week. Look like you planned it.",
        themeSetBy: null,
        previewAt: opensAt,
        opensAt: opensAt,
        closesAt: w.closesAt,
        voteClosesAt: w.voteClosesAt,
        winnerEntryId: null,
        advantage: null,
        seasonNumber: 1,
        updatedAt: 1,
      },
    ],
    entries: [],
    votes: [],
    reactions: [],
    season: { number: 1, target: SEASON_TARGET, updatedAt: 1 },
    halloffame: [],
  };
}

/* ============================================================
   SHARED STATE — merge, load, save, poll
   ============================================================ */

function mergeById(a, b, stamp) {
  const m = new Map();
  (a || []).concat(b || []).forEach((x) => {
    const prev = m.get(x.id);
    if (!prev || (x[stamp] || 0) >= (prev[stamp] || 0)) m.set(x.id, x);
  });
  return Array.from(m.values());
}

function mergePlayers(a, b) {
  const out = Object.assign({}, a || {});
  Object.keys(b || {}).forEach((k) => {
    const mine = out[k];
    const theirs = b[k];
    if (!mine || (theirs.updatedAt || 0) >= (mine.updatedAt || 0)) out[k] = theirs;
  });
  return out;
}

function mergeState(a, b) {
  if (!a) return b;
  if (!b) return a;
  // A reset starts a new epoch. Different epochs never merge — the newer one
  // wins outright, so wiping the season can't be undone by a stale phone.
  const ea = a.epoch || 0;
  const eb = b.epoch || 0;
  if (ea !== eb) return eb > ea ? b : a;
  return {
    epoch: ea,
    version: 2,
    createdAt: Math.min(a.createdAt || Infinity, b.createdAt || Infinity),
    players: mergePlayers(a.players, b.players),
    rounds: mergeById(a.rounds, b.rounds, "updatedAt").sort((x, y) => x.number - y.number),
    entries: mergeById(a.entries, b.entries, "updatedAt"),
    votes: mergeById(a.votes, b.votes, "at"),
    reactions: mergeById(a.reactions || [], b.reactions || [], "at"),
    season: (b.season && b.season.updatedAt || 0) >= (a.season && a.season.updatedAt || 0) ? (b.season || a.season) : a.season,
    halloffame: mergeById(a.halloffame || [], b.halloffame || [], "at"),
  };
}

const Sync = {
  online: false,
  async pull() {
    try {
      const r = await fetch(API, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      this.online = true;
      return j && j.rounds ? j : null;
    } catch (e) {
      this.online = false;
      return null;
    }
  },
  async push(state) {
    try {
      localStorage.setItem(LKEY, JSON.stringify(state));
    } catch (e) {}
    if (!this.online) return state;
    try {
      // Read-merge-write. A straight PUT would drop anything another player
      // saved since our last poll.
      let merged = state;
      const r = await fetch(API, { cache: "no-store" });
      if (r.ok) {
        const j = await r.json();
        if (j && j.rounds) merged = mergeState(state, j);
      }
      await fetch(API, {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(merged),
      });
      try { localStorage.setItem(LKEY, JSON.stringify(merged)); } catch (e) {}
      return merged;
    } catch (e) {
      this.online = false;
      return state;
    }
  },
  async replace(state) {
    try { localStorage.setItem(LKEY, JSON.stringify(state)); } catch (e) {}
    if (!this.online) return state;
    try {
      await fetch(API, {
        method: "PUT",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(state),
      });
      return state;
    } catch (e) {
      this.online = false;
      return state;
    }
  },
  local() {
    try {
      const raw = localStorage.getItem(LKEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  },
};

/* ============================================================
   RULES
   ============================================================ */

const liveEntries = (s) => s.entries.filter((e) => !e.deleted);
const liveVotes = (s) => s.votes.filter((v) => !v.removed);
const liveReactions = (s) => (s.reactions || []).filter((r) => !r.removed);

function phaseOf(round, now) {
  if (!round) return "none";
  if (now < round.opensAt) return "preview";
  if (now < round.closesAt) return "design";
  if (now < round.voteClosesAt) return "voting";
  return "results";
}

const PHASE_LABEL = {
  preview: "Opening soon",
  design: "Designing",
  voting: "Voting open",
  results: "Results in",
};

const currentRound = (s) => s.rounds[s.rounds.length - 1];
const entriesFor = (s, roundId) => liveEntries(s).filter((e) => e.roundId === roundId);
const tallyFor = (s, entryId, category) =>
  liveVotes(s)
    .filter((v) => v.entryId === entryId && (v.category || "main") === (category || "main"))
    .reduce((n, v) => n + (v.weight || 1), 0);

function rankEntries(s, roundId, category) {
  return entriesFor(s, roundId)
    .map((e) => ({ entry: e, votes: tallyFor(s, e.id, category) }))
    .sort((a, b) => b.votes - a.votes || a.entry.createdAt - b.entry.createdAt);
}

/* how many votes of a given kind this player has left in this round */
function votesLeft(s, playerId, roundId, category) {
  const cap = (AWARD_BY_ID[category] || AWARD_BY_ID.main).votes;
  const used = liveVotes(s).filter(
    (v) => v.playerId === playerId && v.roundId === roundId && (v.category || "main") === category
  ).length;
  return Math.max(0, cap - used);
}

function eligibleFor(entry, category) {
  const a = AWARD_BY_ID[category];
  if (!a || !a.requires) return true;
  return !!(entry.items && entry.items[a.requires]);
}

/* side award winners for a round */
function awardWinners(s, roundId) {
  const out = [];
  AWARDS.forEach((a) => {
    if (a.id === "main") return;
    const ranked = rankEntries(s, roundId, a.id).filter((r) => r.votes > 0 && eligibleFor(r.entry, a.id));
    if (ranked.length) out.push({ award: a, entry: ranked[0].entry, votes: ranked[0].votes });
  });
  return out;
}

const reactionCount = (s, entryId, emoji) =>
  liveReactions(s).filter((r) => r.entryId === entryId && r.emoji === emoji).length;

/* season table: 10 / 6 / 4 for the podium, 1 for turning up, 2 per side award */
function standings(s, seasonNumber) {
  const table = {};
  const bump = (pid, name, pts, key) => {
    if (!table[pid]) table[pid] = { playerId: pid, name: name, points: 0, wins: 0, awards: 0, looks: 0 };
    table[pid].points += pts;
    if (key) table[pid][key] += 1;
  };
  s.rounds
    .filter((r) => (r.seasonNumber || 1) === seasonNumber && r.winnerEntryId)
    .forEach((r) => {
      const ranked = rankEntries(s, r.id);
      ranked.forEach((x, i) => {
        bump(x.entry.playerId, x.entry.playerName, i < 3 ? POINTS[i] : POINTS_TAIL, "looks");
        if (i === 0) table[x.entry.playerId].wins += 1;
      });
      awardWinners(s, r.id).forEach((w) => {
        bump(w.entry.playerId, w.entry.playerName, POINTS_AWARD, "awards");
      });
    });
  return Object.keys(table)
    .map((k) => table[k])
    .sort((a, b) => b.points - a.points || b.wins - a.wins || a.name.localeCompare(b.name));
}

function advantageFor(s, playerId, roundNumber) {
  const prev = s.rounds.find((r) => r.number === roundNumber - 1);
  if (!prev || !prev.advantage) return null;
  if (prev.advantage.playerId !== playerId) return null;
  if (prev.advantage.type === "theme_control") return null;
  return prev.advantage.type;
}

const maxSubmissions = (s, pid, round) =>
  advantageFor(s, pid, round.number) === "extra_slot" ? 6 : 5;

const wardrobeFor = (s, pid, round) => {
  const unlocked = advantageFor(s, pid, round.number) === "rare_unlock";
  return WARDROBE.filter(
    (i) => (!i.rare || unlocked) && (!i.dropRound || i.dropRound <= round.number)
  );
};

const isNewDrop = (item, round) => item.dropRound === round.number;

function autoFinalize(state, now) {
  let changed = false;
  const rounds = state.rounds.map((r) => {
    if (!r.winnerEntryId && now >= r.voteClosesAt + 15000) {
      const ranked = rankEntries(state, r.id);
      if (ranked.length) {
        changed = true;
        return Object.assign({}, r, { winnerEntryId: ranked[0].entry.id, updatedAt: Date.now() });
      }
    }
    return r;
  });
  return changed ? Object.assign({}, state, { rounds }) : null;
}

/* The week runs Monday to Monday:
   design Mon 00:00 -> Sat 18:00, vote Sat 18:00 -> Sun 20:00, results Sun night. */
const CLOSE_DAY = 5;    // Saturday, counting from Monday = 0
const CLOSE_HOUR = 18;
const VOTE_DAY = 6;     // Sunday
const VOTE_HOUR = 20;

function weekOf(ts) {
  const d = new Date(ts);
  const back = (d.getDay() + 6) % 7; // days since Monday
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - back, 0, 0, 0, 0);
  const closes = new Date(monday);
  closes.setDate(monday.getDate() + CLOSE_DAY);
  closes.setHours(CLOSE_HOUR, 0, 0, 0);
  const voteCloses = new Date(monday);
  voteCloses.setDate(monday.getDate() + VOTE_DAY);
  voteCloses.setHours(VOTE_HOUR, 0, 0, 0);
  return { opensAt: monday.getTime(), closesAt: closes.getTime(), voteClosesAt: voteCloses.getTime() };
}

/* Starting a round drops it into this week if there's still a real week left to
   design in, otherwise into next Monday. */
function nextRoundWindow(from) {
  const thisWeek = weekOf(from);
  if (thisWeek.closesAt - from >= DAY) return thisWeek;
  return weekOf(from + 7 * DAY);
}

const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
function whenLabel(ts) {
  const d = new Date(ts);
  let h = d.getHours();
  const m = d.getMinutes();
  const ampm = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return DAY_NAMES[d.getDay()] + " " + h + (m ? ":" + String(m).padStart(2, "0") : "") + ampm;
}

}

}

function toLocalInput(ts) {

}

function RunwayShow({ looks, me, canVote, votedIds, onVote, onReact, onClose, state, round, anon }) {
  const [i, setI] = useState(0);
  const [playing, setPlaying] = useState(true);
  const n = looks.length;
  const go = (d) => setI((x) => (x + d + n) % n);

  useEffect(() => {
    if (!playing || n < 2) return;
    const t = setTimeout(() => setI((x) => (x + 1) % n), 4200);
    return () => clearTimeout(t);
  }, [i, playing, n]);

  useEffect(() => {
    const k = (e) => {
      if (e.key === "ArrowRight") go(1);
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "Escape") onClose();
    };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [n]);

  if (!n) return null;
  const { entry, votes } = looks[i];
  const own = entry.playerId === me.id;
  const voted = votedIds.has(entry.id);

  return (
    <div style={{ position: "fixed", inset: 0, background: PAPER, zIndex: 60, display: "flex", flexDirection: "column" }}>
      <div className="flex items-center justify-between" style={{ padding: "16px 18px", borderBottom: "1px solid " + INK }}>
        <Eyebrow>The runway, look {i + 1} of {n}</Eyebrow>
        <button type="button" onClick={onClose} style={{ background: "none", border: "none", fontFamily: DISPLAY, fontSize: 26, lineHeight: 1, cursor: "pointer" }}>×</button>
      </div>

      <div style={{ flex: "1 1 auto", position: "relative", overflow: "hidden", display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
        <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, height: "38%", background: CARD, borderTop: "1px solid " + HAIR }} />
        <div style={{ position: "absolute", left: "50%", bottom: 0, width: 1, height: "38%", background: HAIR }} />
        <Model
          key={entry.id}
          model={entry.model}
          items={entry.items}
          colors={entry.colors}
          style={{ height: "94%", maxWidth: "92%", position: "relative", animation: "walk 620ms ease-out" }}
        />
      </div>

      <div style={{ borderTop: "1px solid " + INK, padding: "16px 18px calc(18px + env(safe-area-inset-bottom))" }}>
        <div className="flex items-baseline justify-between" style={{ gap: 12 }}>
          <div style={{ fontFamily: DISPLAY, fontSize: 26, lineHeight: 1.1 }}>{entry.name}</div>
          {canVote && <div style={{ fontFamily: DISPLAY, fontSize: 22, color: SPOT }}>{votes}</div>}
        </div>
        <div style={{ marginTop: 6 }}>
          <Eyebrow color={anon && !own ? HAIR : GRAPHITE}>{anon && !own ? "Designer hidden" : entry.playerName}</Eyebrow>
        </div>
        {entry.caption && (
          <p style={{ fontFamily: DISPLAY, fontStyle: "italic", fontSize: 15, lineHeight: 1.45, marginTop: 8 }}>{entry.caption}</p>
        )}
        <div style={{ marginTop: 12 }}>
          <ReactionRow state={state} entryId={entry.id} me={me} onReact={onReact} small />
        </div>

        <div className="flex flex-wrap items-center" style={{ gap: 8, marginTop: 12 }}>
          <Button small kind="quiet" onClick={() => go(-1)}>Back</Button>
          <Button small kind="quiet" onClick={() => setPlaying(!playing)}>{playing ? "Pause" : "Play"}</Button>
          <Button small kind="quiet" onClick={() => go(1)}>Next</Button>
          <ShareLook entry={entry} round={round} designer={anon && !own ? "Runway" : entry.playerName} label="Save" />
          <div style={{ flex: "1 1 auto" }} />
          {canVote && !own && (
            <Button small kind={voted ? "solid" : "spot"} onClick={() => onVote(entry.id, "main")}>{voted ? "Voted" : "Vote"}</Button>
          )}
          {own && <Eyebrow>Your look</Eyebrow>}
        </div>
      </div>
    </div>
  );
}


/* ---- turn a look into a shareable PNG ---- */
async function exportLook(host, entry, round, designer) {
  const svg = host.querySelector("svg");
  if (!svg) throw new Error("nothing to draw");
  svg.setAttribute("width", "460");
  svg.setAttribute("height", "794");
  svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  const markup = new XMLSerializer().serializeToString(svg);
  const url = URL.createObjectURL(new Blob([markup], { type: "image/svg+xml;charset=utf-8" }));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });

  const W = 900, H = 1240;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  x.fillStyle = PAPER; x.fillRect(0, 0, W, H);
  x.fillStyle = CARD; x.fillRect(56, 150, W - 112, 830);
  x.strokeStyle = HAIR; x.lineWidth = 2; x.strokeRect(56, 150, W - 112, 830);
  x.drawImage(img, 220, 168, 460, 794);
  URL.revokeObjectURL(url);

  x.fillStyle = INK;
  x.font = "600 34px Georgia, 'Times New Roman', serif";
  x.fillText("Runway", 56, 78);
  x.fillStyle = GRAPHITE;
  x.font = "18px Arial, sans-serif";
  x.fillText((round ? "Round " + String(round.number).padStart(2, "0") + "  \u00b7  " + round.theme : "").toUpperCase(), 56, 112);

  x.fillStyle = INK;
  x.font = "600 56px Georgia, 'Times New Roman', serif";
  x.fillText((entry.name || "").slice(0, 26), 56, 1050);
  x.fillStyle = GRAPHITE;
  x.font = "20px Arial, sans-serif";
  x.fillText((designer || entry.playerName || "").toUpperCase(), 56, 1088);
  if (entry.caption) {
    x.fillStyle = INK;
    x.font = "italic 26px Georgia, serif";
    x.fillText(entry.caption.slice(0, 52), 56, 1140);
  }
  x.fillStyle = HAIR;
  x.fillRect(56, 1180, W - 112, 2);

  const blob = await new Promise((r) => c.toBlob(r, "image/png"));
  const filename = ((entry.name || "look").replace(/[^a-z0-9]+/gi, "-").toLowerCase()) + ".png";
  const file = new File([blob], filename, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: entry.name }); return; } catch (e) {}
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function ShareLook({ entry, round, designer, label }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    if (!busy) return;
    let alive = true;
    const t = setTimeout(() => {
      exportLook(ref.current, entry, round, designer)
        .catch(() => alive && setErr(true))
        .then(() => alive && setBusy(false));
    }, 50);
    return () => { alive = false; clearTimeout(t); };
  }, [busy]);

  return (
    <span>
      <Button small kind="quiet" onClick={() => { setErr(false); setBusy(true); }}>
        {busy ? "Making it" : err ? "Try again" : label || "Save as image"}
      </Button>
      {busy && (
        <div ref={ref} aria-hidden="true" style={{ position: "fixed", left: -4000, top: 0, width: 460, height: 794 }}>
          <Model model={entry.model} items={entry.items} colors={entry.colors} style={{ width: 460, height: 794 }} />
        </div>
      )}
    </span>
  );
}
